document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* \u2014 dialog \u2014 */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* \u2014 rounded frame: everything softens, small controls go pill \u2014 */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"b3608e0d-c0bb-434e-8937-5cf276bb1c10\"><\u002Fscript>\n<style>\nhtml,body{margin:0;min-height:100%;background:var(--color-neutral-200)}\n*{scrollbar-width:thin;scrollbar-color:transparent transparent}\nbody.rolando *{scrollbar-color:rgba(32,30,29,.3) transparent}\n::-webkit-scrollbar{width:6px;height:6px;background:transparent}\n::-webkit-scrollbar-track{background:transparent;border:0}\n::-webkit-scrollbar-thumb{background:transparent;border-radius:999px;transition:background .35s ease}\nbody.rolando ::-webkit-scrollbar-thumb{background:rgba(32,30,29,.3)}\na{color:var(--color-accent-700)}\na:hover{color:var(--color-accent-900)}\n.ep-page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 28px 32px;box-sizing:border-box;\n  background:radial-gradient(120% 80% at 50% 0%, var(--color-accent-2-200) 0%, var(--color-neutral-200) 60%)}\n.ep-shell{position:relative;width:100%;max-width:1120px;height:min(900px,calc(100dvh - 60px));display:flex;flex-direction:column;overflow:hidden;\n  background:var(--color-bg);border-radius:32px;box-shadow:var(--shadow-lg)}\n.ep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}\n.ep-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:70px;width:100%;max-width:1040px;margin:0 auto;padding:0 24px;box-sizing:border-box}\n.ep-menu{position:absolute;right:24px;top:64px;width:262px;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:10px;z-index:60}\n@media (max-width:640px){.ep-menu{right:12px;left:12px;width:auto}}\n/* \u2500\u2500 tema \u2500\u2500 */\n:root{color-scheme:light}\n/* controles herdam a cor do texto (sem isso, com o sistema em modo escuro, bot\u00f5es ficavam com texto branco) */\n:where(button,input,textarea,select){color:inherit}\nhtml[data-theme=\"dark\"]{color-scheme:dark;\n  --color-bg:#1c1a18;--color-surface:#2b2723;--color-text:#f1e8da;--color-divider:color-mix(in srgb,#f1e8da 14%,transparent);\n  --color-neutral-100:#25221f;--color-neutral-200:#2d2925;--color-neutral-300:#3a352f;--color-neutral-400:#555047;--color-neutral-500:#716a5f;\n  --color-neutral-600:#9b9283;--color-neutral-700:#bbb1a2;--color-neutral-800:#d8cfc1;--color-neutral-900:#f0e8dd;\n  --color-accent:#d27b43;\n  --color-accent-100:#2c1c13;--color-accent-200:#3c2517;--color-accent-300:#56331c;--color-accent-400:#7c4826;--color-accent-500:#b2622d;\n  --color-accent-600:#d67f48;--color-a order-radius:999px;gap:8px;grid-column:1/-1\" onClick=\"{{ irNovoPet }}\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n      Novo pet<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 12px\">\n    <h4 style=\"font-family:var(--font-heading);font-size:19px;margin:0\">Dicas de quem cuida<\u002Fh4>\n    <button class=\"btn btn-ghost\" style=\"font-size:13px\" onClick=\"{{ irDicas }}\">Ver todas<\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"font-size:12.5px;color:var(--color-neutral-700);margin:0 0 14px\">Publicadas por veterin\u00e1rios parceiros, atualizadas toda semana.<\u002Fp>\n  <div class=\"ep-grid\">\n    <sc-for list=\"{{ dicasHome }}\" as=\"d\" hint-placeholder-count=\"3\">\n      <button style=\"display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:13px 14px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ d.abrir }}\">\n        <div style=\"width:44px;height:44px;border-radius:999px;background:var(--color-accent-2-200);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-800)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21c-4-2.5-7-5.6-7-9.5A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7 3.5c0 3.9-3 7-7 9.5Z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:14.5px;font-weight:600;margin-bottom:2px\">{{ d.titulo }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ d.autor }} \u00b7 {{ d.tempo }}<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"tag tag-neutral\">{{ d.categoria }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEditarPerfil }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irPerfil }}\">\u2190 Cancelar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 20px\">Editar perfil<\u002Fh2>\n\n  <div style=\"display:flex;justify-content:center;margin-bottom:24px\">\n    <button style=\"position:relative;width:104px;height:104px;border-radius:999px;background:var(--color-accent-2-300);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);border:0;cursor:pointer\" onClick=\"{{ trocarFotoTutor }}\"><img alt=\"\" src=\"{{ tutorFotoSrc }}\" style=\"position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;display:{{ tutorFotoDisp }};pointer-events:none\"><span style=\"visibility:{{ tutorLetraVis }}\">{{ tutorIniciais }}<\u002Fspan>\n      <span style=\"position:absolute;bottom:0;right:0;width:34px;height:34px;border-radius:999px;background:var(--color-accent);border:3px solid var(--color-bg);display:flex;align-items:center;justify-content:center\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n      <\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Nome completo<\u002Flabel>\n    <input class=\"input\" value=\"{{ epNome }}\" onChange=\"{{ setEpNome }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>E-mail<\u002Flabel>\n    <input class=\"input\" value=\"{{ epEmail }}\" onChange=\"{{ setEpEmail }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Telefone<\u002Flabel>\n    <input class=\"input\" value=\"{{ epTelefone }}\" onChange=\"{{ setEpTelefone }}\" inputmode=\"tel\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:8px\"><label>Nome de usu\u00e1rio<\u002Flabel>\n    <input class=\"input\" value=\"{{ epUsuario }}\" onChange=\"{{ setEpUsuario }}\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 22px\">\u00c9 o que aparece nas telas e nos documentos compartilhados. Seu CPF fica guardado apenas no login.<\u002Fp>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarPerfil }}\">Salvar altera\u00e7\u00f5es<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEditarPet }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCaderneta }}\">\u2190 Cancelar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 4px\">Editar {{ petNome }}<\u002Fh2>\n  <p style=\"font-size:13px;color:var(--color-neutral-700);margin:0 0 22px\">Dados do pet. As vacinas s\u00f3 mudam pela caderneta.<\u002Fp>\n\n  <div style=\"display:flex;justify-content:center;margin-bottom:24px\">\n    <button style=\"position:relative;width:110px;height:110px;border-radius:999px;background:var(--color-accent-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:36px;color:var(--color-accent-800);border:0;cursor:pointer\" onClick=\"{{ trocarFotoPet }}\"><img alt=\"\" src=\"{{ petFotoSrc }}\" style=\"position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;display:{{ petFotoDisp }};pointer-events:none\"><span style=\"visibility:{{ petLetraVis }}\">{{ petIniciais }}<\u002Fspan>\n      <span style=\"position:absolute;bottom:0;right:0;width:36px;height:36px;border-radius:999px;background:var(--color-accent);border:3px solid var(--color-bg);display:flex;align-items:center;justify-content:center\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n      <\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);text-align:center;margin:-14px 0 20px\">{{ avisoFotoPet }}<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Nome<\u002Flabel>\n    <input class=\"input\" value=\"{{ edNome }}\" onChange=\"{{ setEdNome }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Esp\u00e9cie<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ edSegCanino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetCanino }}\">Canino<\u002Fbutton>\n      <button class=\"tag {{ edSegFelino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetFelino }}\">Felino<\u002Fbutton>\n      <button class=\"tag {{ edSegOutros }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetOutros }}\">Outros<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Sexo<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ edClsMacho }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetMacho }}\">Macho<\u002Fbutton>\n      <button class=\"tag {{ edClsFemea }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetFemea }}\">F\u00eamea<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Ra\u00e7a<\u002Flabel>\n    <input class=\"input\" value=\"{{ edRaca }}\" onChange=\"{{ setEdRaca }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:6px\"><label>Nascimento ou resgate<\u002Flabel>\n    <input class=\"input\" type=\"date\" max=\"{{ hojeIso }}\" value=\"{{ edData }}\" onChange=\"{{ setEdData }}\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 16px\">Idade calculada: {{ edIdade }}<\u002Fp>\n  <div style=\"display:flex;gap:12px;margin-bottom:16px\">\n    <div class=\"field\" style=\"flex:1\"><label>Peso m\u00ednimo ideal<\u002Flabel>\n      <input class=\"input\" value=\"{{ minInput }}\" onChange=\"{{ setMinInput }}\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n    <div class=\"field\" style=\"flex:1\"><label>Peso m\u00e1ximo ideal<\u002Flabel>\n      <input class=\"input\" value=\"{{ maxInput }}\" onChange=\"{{ setMaxInput }}\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:26px\"><label>Microchip<\u002Flabel>\n    <input class=\"input\" value=\"{{ edChip }}\" onChange=\"{{ setEdChip }}\" placeholder=\"000 000 000 000 000\" style=\"width:100%\"><\u002Fdiv>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarEdicaoPet }}\">Salvar altera\u00e7\u00f5es<\u002Fbutton>\n  <button class=\"btn btn-ghost btn-block\" style=\"height:46px\" onClick=\"{{ irObito }}\">Registrar falecimento<\u002Fbutton>\n  <button class=\"btn btn-ghost btn-block\" style=\"height:46px;color:var(--color-accent-800)\" onClick=\"{{ irRemoverPet }}\">Remover pet<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isObito }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCaderneta }}\">\u2190 Voltar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 6px\">Despedida de {{ petNome }}<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 22px;text-wrap:pretty\">Sentimos muito. Ao confirmar, a caderneta de {{ petNome }} vira um memorial: o hist\u00f3rico fica guardado, os lembretes param de chegar e voc\u00ea pode acrescentar lembran\u00e7as quando quiser.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Data<\u002Flabel>\n    <input class=\"input\" type=\"date\" max=\"{{ hojeIso }}\" value=\"{{ obitoData }}\" onChange=\"{{ setObitoData }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Uma frase para lembrar (opcional)<\u002Flabel>\n    <textarea class=\"input\" style=\"width:100%;border-radius:var(--radius-lg);min-height:84px\" value=\"{{ obitoFrase }}\" onChange=\"{{ setObitoFrase }}\" placeholder=\"O que voc\u00ea n\u00e3o quer esquecer dele\"><\u002Ftextarea><\u002Fdiv>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarObito }}\">Criar memorial<\u002Fbutton>\n  <button class=\"btn btn-ghost btn-block\" style=\"height:46px\" onClick=\"{{ irCaderneta }}\">Voltar<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRemoverPet }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ voltarEditarPet }}\">\u2190 Voltar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 6px\">Remover {{ petNome }}<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 22px;text-wrap:pretty\">A caderneta de {{ petNome }} sai deste aparelho e da nuvem: vacinas, pesos, anota\u00e7\u00f5es, cuidados, medicamentos e fotos. Os lembretes param de chegar. Isso n\u00e3o pode ser desfeito.<\u002Fp>\n\n  <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:16px 16px 14px;margin-bottom:14px\">\n    <div style=\"font-size:14px;font-weight:600;margin-bottom:3px\">1. Guarde o hist\u00f3rico<\u002Fdiv>\n    <p style=\"font-size:12.5px;color:var(--color-accent-2-900);margin:0 0 12px\">Baixe a caderneta completa em PDF e salve em Arquivos, no WhatsApp, no e-mail ou onde preferir.<\u002Fp>\n    <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px;font-size:15px;opacity:{{ opacidadePdf }}\" onClick=\"{{ baixarAntesRemover }}\">{{ textoBaixarRemocao }}<\u002Fbutton>\n    <p style=\"font-size:12px;color:var(--color-accent-2-900);margin:8px 0 0;text-align:center\">{{ textoRemocaoSalva }}<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px 16px 14px\">\n    <div style=\"font-size:14px;font-weight:600;margin-bottom:3px\">2. Remover<\u002Fdiv>\n    <p style=\"font-size:12.5px;color:var(--color-neutral-700);margin:0 0 12px\">{{ textoPassoRemover }}<\u002Fp>\n    <button class=\"btn btn-block\" style=\"height:48px;border-radius:999px;font-size:15px;border:1px solid var(--color-accent-800);background:{{ bgRemover }};color:{{ corRemover }}\" onClick=\"{{ removerPetAgora }}\">{{ textoRemover }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMemorial }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto\">\n  <div style=\"background:var(--color-accent-2-200);padding:28px 24px 30px;text-align:center\">\n    <button class=\"btn btn-ghost\" style=\"padding-left:0;float:left;color:var(--color-accent-2-900)\" onClick=\"{{ irHome }}\">\u2190 Meus pets<\u002Fbutton>\n    <div style=\"clear:both;height:6px\"><\u002Fdiv>\n    <div style=\"position:relative;width:150px;height:148px;margin:0 auto 12px;display:flex;align-items:flex-end;justify-content:center\">\n      <div style=\"position:relative;z-index:1;width:118px;height:118px;border-radius:999px;background:var(--color-accent-100);box-shadow:0 0 0 3px var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:42px;color:var(--color-accent-800)\"><img alt=\"\" src=\"{{ petFotoSrc }}\" style=\"position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;display:{{ petFotoDisp }};pointer-events:none\"><span style=\"visibility:{{ petLetraVis }}\">{{ petIniciais }}<\u002Fspan><\u002Fdiv>\n      <svg width=\"104\" height=\"34\" viewBox=\"0 0 104 34\" aria-hidden=\"true\" style=\"position:absolute;left:50%;top:2px;transform:translateX(-50%);pointer-events:none;overflow:visible\"><defs><filter id=\"ep-aureola-brilho\" x=\"-30%\" y=\"-80%\" width=\"160%\" height=\"260%\"><feGaussianBlur stdDeviation=\"3.2\"/><\u002Ffilter><\u002Fdefs><ellipse cx=\"52\" cy=\"17\" rx=\"40\" ry=\"9.5\" fill=\"none\" stroke=\"#f3d98b\" stroke-width=\"7\" opacity=\".55\" filter=\"url(#ep-aureola-brilho)\"/><ellipse cx=\"52\" cy=\"17\" rx=\"40\" ry=\"9.5\" fill=\"none\" stroke=\"#d9b45a\" stroke-width=\"3.2\"/><ellipse cx=\"52\" cy=\"16\" rx=\"40\" ry=\"9.5\" fill=\"none\" stroke=\"#fbeec2\" stroke-width=\"1\" opacity=\".9\"/><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-2-900);margin-bottom:6px\">Em mem\u00f3ria<\u002Fdiv>\n    <h2 style=\"font-family:var(--font-heading);font-size:32px;margin:0 0 4px\">{{ petNome }}<\u002Fh2>\n    <div style=\"font-size:13.5px;color:var(--color-accent-2-900)\">{{ memorialPeriodo }}<\u002Fdiv>\n    <div style=\"font-size:13px;color:var(--color-accent-2-900);margin-top:2px\">{{ memorialConvivio }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:24px 20px 30px\">\n    <sc-if value=\"{{ temFraseMemorial }}\">\n      <p style=\"font-family:var(--font-heading);font-size:19px;line-height:1.4;text-align:center;margin:0 0 24px;text-wrap:pretty\">{{ memorialFrase }}<\u002Fp>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;gap:9px;margin-bottom:24px\">\n      <div style=\"flex:1;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:12px;text-align:center\">\n        <div style=\"font-family:var(--font-heading);font-size:22px;line-height:1\">{{ petTotalVacinas }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ rotuloVacinas }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:12px;text-align:center\">\n        <div style=\"font-family:var(--font-heading);font-size:22px;line-height:1\">{{ memorialNotas }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ rotuloNotas }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:12px;text-align:center\">\n        <div style=\"font-family:var(--font-heading);font-size:22px;line-height:1\">{{ memorialConsultas }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ rotuloConsultas }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px\">\n      <h4 style=\"font-family:var(--font-heading);font-size:18px;margin:0\">\u00c1lbum<\u002Fh4>\n      <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ totalFotosAlbum }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ albumVazio }}\">\n      <button style=\"width:100%;border:1.5px dashed var(--color-accent-2-500);background:transparent;border-radius:var(--radius-lg);padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--color-accent-2-800);font-family:var(--font-body);margin-bottom:26px\" onClick=\"{{ adicionarFotoAlbum }}\">\n        <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"><\u002Frect><circle cx=\"9\" cy=\"9\" r=\"2\"><\u002Fcircle><path d=\"m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:14px;font-weight:600\">{{ textoAdicionarAlbum }}<\u002Fspan>\n        <span style=\"font-size:12px;color:var(--color-neutral-700)\">As fotos ficam guardadas s\u00f3 para voc\u00ea.<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ albumComFotos }}\">\n      <div class=\"ep-album\">\n        <sc-for list=\"{{ album }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <button class=\"ep-album-foto\" aria-label=\"Ver foto\" onClick=\"{{ f.abrir }}\"><img alt=\"\" src=\"{{ f.src }}\" loading=\"lazy\" style=\"display:{{ f.disp }}\"><\u002Fbutton>\n        <\u002Fsc-for>\n        <button class=\"ep-album-mais\" aria-label=\"Adicionar foto\" onClick=\"{{ adicionarFotoAlbum }}\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n          <span>{{ textoMaisAlbum }}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ temFotoAberta }}\">\n      <div style=\"position:fixed;inset:0;z-index:95;background:#121010;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 12px\">\n          <button style=\"border:0;background:transparent;color:#f5ead8;font-family:var(--font-body);font-size:15px;min-height:44px;padding:0 10px;cursor:pointer\" onClick=\"{{ fecharFotoAlbum }}\">Fechar<\u002Fbutton>\n          <span style=\"color:rgba(245,234,216,.75);font-size:13px\">{{ dataFotoAberta }}<\u002Fspan>\n          <button style=\"border:0;background:transparent;color:#f3a98a;font-family:var(--font-body);font-size:15px;min-height:44px;padding:0 10px;cursor:pointer\" onClick=\"{{ removerFotoAlbum }}\">Remover<\u002Fbutton>\n        <\u002Fdiv>\n        <button style=\"flex:1;min-height:0;border:0;background:transparent;padding:12px;display:flex;align-items:center;justify-content:center;cursor:pointer\" onClick=\"{{ fecharFotoAlbum }}\"><img alt=\"\" src=\"{{ srcFotoAberta }}\" style=\"max-width:100%;max-height:100%;border-radius:14px;object-fit:contain\"><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"height:26px\"><\u002Fdiv>\n\n    <h4 style=\"font-family:var(--font-heading);font-size:18px;margin:0 0 12px\">Lembran\u00e7as<\u002Fh4>\n    <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:18px\">\n      <sc-for list=\"{{ lembrancas }}\" as=\"l\" hint-placeholder-count=\"2\">\n        <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px\">\n          <div style=\"font-size:12px;color:var(--color-neutral-700);margin-bottom:4px\">{{ l.data }}<\u002Fdiv>\n          <p style=\"font-size:14px;margin:0;text-wrap:pretty\">{{ l.texto }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"field\" style=\"margin-bottom:10px\"><label>Escrever uma lembran\u00e7a<\u002Flabel>\n      <textarea class=\"input\" style=\"width:100%;border-radius:var(--radius-lg);min-height:78px\" value=\"{{ lembrancaInput }}\" onChange=\"{{ setLembrancaInput }}\" placeholder=\"Um dia, um jeito, uma mania\"><\u002Ftextarea><\u002Fdiv>\n    <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ salvarLembranca }}\">Guardar lembran\u00e7a<\u002Fbutton>\n    <button class=\"btn btn-secondary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ verHistoricoMemorial }}\">Ver o hist\u00f3rico completo<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ mostrarExtras }}\">\n<div style=\"flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg)\">\n<dc-import name=\"EsserePet Extras\" v=\"{{ extras }}\" hint-size=\"100%,100%\" style=\"flex:1;min-height:0;height:100%;display:flex;flex-direction:column;background:var(--color-bg)\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNovoPet }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:14px\" onClick=\"{{ irHome }}\">\u2190 Voltar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:29px;margin:0 0 22px\">Novo pet<\u002Fh2>\n  <div style=\"display:flex;justify-content:center;margin-bottom:26px\">\n    <button style=\"position:relative;width:110px;height:110px;border-radius:999px;border:{{ bordaFotoNovoPet }};background-color:{{ bgFotoNovoPet }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ corFotoNovoPet }};font-family:var(--font-body);font-size:11px\" onClick=\"{{ tirarFotoNovoPet }}\"><img alt=\"\" src=\"{{ fotoNovoPetSrc }}\" style=\"position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;display:{{ fotoNovoPetDisp }};pointer-events:none\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n      {{ rotuloFotoNovoPet }}<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Nome<\u002Flabel>\n    <input class=\"input\" value=\"{{ novoNome }}\" onChange=\"{{ setNovoNome }}\" placeholder=\"Como voc\u00ea chama\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Esp\u00e9cie<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ segCanino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setCanino }}\">Canino<\u002Fbutton>\n      <button class=\"tag {{ segFelino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setFelino }}\">Felino<\u002Fbutton>\n      <button class=\"tag {{ segOutros }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setOutros }}\">Outros<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Sexo<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ clsMacho }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setMacho }}\">Macho<\u002Fbutton>\n      <button class=\"tag {{ clsFemea }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setFemea }}\">F\u00eamea<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Ra\u00e7a<\u002Flabel>\n    <input class=\"input\" value=\"{{ novaRaca }}\" onChange=\"{{ setNovaRaca }}\" placeholder=\"SRD\" style=\"width:100%\"><\u002Fdiv>\n\n  <div class=\"field\" style=\"margin-bottom:10px\"><label>Data de refer\u00eancia<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ clsNascimento }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 14px\" onClick=\"{{ setNascimento }}\">Nascimento<\u002Fbutton>\n      <button class=\"tag {{ clsResgate }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 14px\" onClick=\"{{ setResgate }}\">Resgate / ado\u00e7\u00e3o<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:6px\"><input class=\"input\" type=\"date\" max=\"{{ hojeIso }}\" value=\"{{ novaData }}\" onChange=\"{{ setNovaData }}\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 18px\">A idade do pet \u00e9 calculada a partir dessa data e aparece na home, na ficha e no relat\u00f3rio.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:8px\"><label>Peso atual (kg)<\u002Flabel>\n    <input class=\"input\" value=\"{{ novoPeso }}\" onChange=\"{{ setNovoPeso }}\" placeholder=\"0,0\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 18px\">Este ser\u00e1 o primeiro registro do hist\u00f3rico de peso. Novos pesos entram pela aba Peso da caderneta.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:22px\"><label>Microchip (opcional)<\u002Flabel><input class=\"input\" value=\"{{ novoChip }}\" onChange=\"{{ setNovoChip }}\" placeholder=\"000 000 000 000 000\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n\n  <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:22px\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-800)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;margin-top:2px\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"><\u002Fpath><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z\"><\u002Fpath><\u002Fsvg>\n    <p style=\"font-size:12.5px;color:var(--color-accent-2-900);margin:0\">Ao salvar, uma caderneta de vacina\u00e7\u00e3o \u00e9 criada automaticamente para {{ novoNomeOuPet }}.<\u002Fp>\n  <\u002Fdiv>\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarPet }}\">Salvar e criar caderneta<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCadernetas }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:28px 20px 26px\">\n  <h2 style=\"font-family:var(--font-heading);font-size:29px;margin:0 0 4px\">Cadernetas<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 20px\">{{ textoCadernetas }}<\u002Fp>\n  <div class=\"ep-grid\">\n    <sc-for list=\"{{ petsView }}\" as=\"pet\" hint-placeholder-count=\"3\">\n      <button style=\"width:100%;text-align:left;border:0;border-radius:var(--radius-lg);padding:20px;cursor:pointer;font-family:var(--font-body);color:var(--color-text);box-shadow:var(--shadow-md);background:{{ pet.cardBg }}\" onClick=\"{{ pet.abrir }}\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:12px\">\n          <div style=\"position:relative;width:56px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--fon holder=\"0,0\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n        <button class=\"btn btn-primary\" style=\"height:40px;border-radius:999px;opacity:{{ travaPeso.op }};pointer-events:{{ travaPeso.pe }}\" onClick=\"{{ salvarPeso }}\">{{ travaPeso.rotulo }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ abaNotas }}\">\n    <div>\n      <p style=\"font-size:13px;color:var(--color-neutral-700);margin:0 0 14px\">Sintomas, rea\u00e7\u00f5es, consultas \u2014 o que voc\u00ea quiser lembrar e mostrar ao veterin\u00e1rio.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:20px\">\n        <sc-for list=\"{{ notas }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:5px\">{{ n.data }}<\u002Fdiv>\n            <p style=\"font-size:14px;margin:0\">{{ n.texto }}<\u002Fp>\n            <sc-if value=\"{{ n.temFoto }}\">\n              <div style=\"position:relative;margin-top:10px;border-radius:var(--radius-md);overflow:hidden;height:170px;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-300));display:flex;align-items:flex-end;padding:10px 12px\"><img alt=\"\" src=\"{{ n.fotoSrc }}\" style=\"position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;display:{{ n.fotoDisp }};pointer-events:none\">\n                <span style=\"position:relative;font-size:11px;color:var(--color-neutral-100);background:rgba(32,30,29,.45);border-radius:999px;padding:4px 10px\">{{ n.legendaFoto }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"field\" style=\"margin-bottom:10px\"><label>Nova anota\u00e7\u00e3o<\u002Flabe 999px;height:40px;font-size:13px\" onClick=\"{{ irPlanos }}\">Assinar Premium<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px\">\n        <sc-for list=\"{{ cuidados }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px\">\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:8px\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:15px;font-weight:600\">{{ c.nome }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--color-neutral-700)\">\u00daltimo: {{ c.ultimo }} \u00b7 a cada {{ c.intervalo }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span class=\"tag {{ c.tagClass }}\">{{ c.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"flex:1;height:6px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden\">\n                <div style=\"height:100%;border-radius:999px;width:{{ c.progresso }};background:{{ c.barra }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-secondary\" style=\"border-radius:999px;height:34px;font-size:12.5px;padding:0 14px;opacity:{{ c.trava.op }};pointer-events:{{ c.trava.pe }}\" onClick=\"{{ c.registrar }}\">{{ c.trava.rotulo }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px\">\n              <span style=\"font-size:11.5px;color:var(--color-neutral-600)\">{{ c.proximo }}<\u002Fspan>\n              <sc-if value=\"{{ c.naoConfirmando }}\">\n                <button class=\"btn btn-ghost\" style=\"font-size:12px;padding:4px 0;color:var(--color-accent-700)\" onClick=\"{{ c.pedirExclusao }}\">Excluir<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ c.confirmando }}\">\n              <div style=\"background:var(--color-accent-200);border-radius:var(--radius-md);padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                <span style=\"flex:1;min-width:150px;font-size:12.5px;color:var(--color-accent-900)\">Excluir {{ c.nome }} e os lembretes dele?<\u002Fspan>\n                <button class=\"btn btn-ghost\" style=\"font-size:12.5px\" onClick=\"{{ c.cancelarExclusao }}\">Manter<\u002Fbutton>\n                <button class=\"btn btn-primary\" style=\"border-radius:999px;height:34px;font-size:12.5px;padding:0 14px\" onClick=\"{{ c.excluir }}\">Excluir<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h4 style=\"font-family:var(--font-heading);font-size:17px;margin:0 0 10px\">Novo cuidado<\u002Fh4>\n      <div style=\"display:flex;gap:10px;margin-bottom:10px\">\n        <div class=\"field\" style=\"flex:2\"><label>O que \u00e9<\u002Flabel>\n          <input class=\"input\" value=\"{{ cuidadoNome }}\" onChange=\"{{ setCuidadoNome }}\" placeholder=\"Ex.: Corte de unhas\" style=\"width:100%\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><label>A cada (dias)<\u002Flabel>\n          <input class=\"input\" value=\"{{ cuidadoDias }}\" onChange=\"{{ setCuidadoDias }}\" placeholder=\"30\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ salvarCuidado }}\">Adicionar com lembrete<\u002Fbutton>\n      <p style=\"font-size:12px;color:var(--color-neutral-600);margin:10px 0 0\">O app avisa quando o prazo chegar e recalcula a partir da data em que voc\u00ea marcar como feito.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ abaMedicacao }}\">\n    <div>\n      <sc-if value=\"{{ premiumBloqueado }}\">\n        <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);font-size:17px;margin-bottom:4px\">Assine o plano premium para desbloquear essa fun\u00e7\u00e3o<\u002Fdiv>\n          <p style=\"font-size:13px;color:var(--color-accent-2-900);margin:0 0 12px\">Cadastre a receita e receba o lembrete de cada dose no hor\u00e1rio certo.<\u002Fp>\n          <button class=\"btn btn-primary\" style=\"border-radius:999px;height:40px;font-size:13px\" onClick=\"{{ irPlanos }}\">Assinar Premium<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ temMedicacaoAtiva }}\">\n        <div style=\"background:var(--color-accent-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px\">\n            <span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-900)\">Pr\u00f3ximas doses<\u002Fspan>\n            <span style=\"font-size:11.5px;color:var(--color-accent-900)\">agora {{ agoraStr }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ proximasDoses }}\" as=\"d\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--color-accent-300)\">\n              <span style=\"font-family:var(--font-heading);font-size:19px;line-height:1.15;width:62px;flex-shrink:0\">{{ d.hora }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0;font-size:12.5px;color:var(--color-accent-900)\">{{ d.detalhe }}<\u002Fspan>\n              <span class=\"tag {{ d.tagClass }}\" style=\"flex-shrink:0\">{{ d.quando }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n 002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h4 style=\"font-family:var(--font-heading);font-size:17px;margin:0 0 10px\">Nova medica\u00e7\u00e3o<\u002Fh4>\n      <p style=\"font-size:12.5px;color:var(--color-neutral-700);margin:0 0 12px\">Preencha conforme a receita do veterin\u00e1rio.<\u002Fp>\n      <div class=\"field\" style=\"margin-bottom:12px\"><label>Medicamento<\u002Flabel>\n        <input class=\"input\" value=\"{{ medNome }}\" onChange=\"{{ setMedNome }}\" placeholder=\"Ex.: Amoxicilina 250mg\" style=\"width:100%\"><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-bottom:12px\">\n        <div class=\"field\" style=\"flex:2\"><label>Dose<\u002Flabel>\n          <input class=\"input\" value=\"{{ medDose }}\" onChange=\"{{ setMedDose }}\" placeholder=\"1 comprimido\" style=\"width:100%\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><label>A cada (h)<\u002Flabel>\n          <input class=\"input\" value=\"{{ medHoras }}\" onChange=\"{{ setMedHoras }}\" placeholder=\"12\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-bottom:14px\">\n        <div class=\"field\" style=\"flex:1\"><label>Dura\u00e7\u00e3o (dias)<\u002Flabel>\n          <input class=\"input\" value=\"{{ medDias }}\" onChange=\"{{ setMedDias }}\" placeholder=\"7\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><label>Primeira dose<\u002Flabel>\n          <input class=\"input\" type=\"time\" value=\"{{ medHora }}\" aria-label=\"Hor\u00e1rio da 1\u00aa dose\" onChange=\"{{ setMedHora }}\" style=\"width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ salvarMedicacao }}\">Salvar e ativar lembretes<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isVacina }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 20px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCaderneta }}\">\u2190 Caderneta de {{ petNome }}<\u002Fbutton>\n  <div style=\"display:flex;align-items:flex-start;gap:12px;margin-bottom:20px\">\n    <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0;flex:1\">{{ vacNome }}<\u002Fh2>\n    <span class=\"tag {{ vacTagClass }}\" style=\"margin-top:6px\">{{ vacStatus }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:4px 16px;margin-bottom:22px\">\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-divider)\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Esquema<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ vacEsquema }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-divider)\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">\u00daltima aplica\u00e7\u00e3o<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ vacData }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 0\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">{{ vacProximaLabel }}<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ vacProxima }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ podeRegistrarDose }}\">\n    <div style=\"background:{{ fundoNovaDose }};border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:22px\">\n      <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">{{ tituloNovaDose }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:var(--color-neutral-800);margin-bottom:12px;text-wrap:pretty\">{{ textoNovaDose }}<\u002Fdiv>\n      <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px;gap:8px\" onClick=\"{{ registrarDoseDesta }}\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n        Registrar nova dose de {{ vacNome }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <h4 style=\"font-family:var(--font-heading);font-size:17px;margin:0 0 4px\">Hist\u00f3rico de doses<\u002Fh4>\n  <p style=\"font-size:12.5px;color:var(--color-neutral-700);margin:0 0 12px\">{{ vacDosesResumo }}<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <sc-for list=\"{{ vacDoses }}\" as=\"d\" hint-placeholder-count=\"2\">\n      <div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px;background:{{ d.fundo }}\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:8px;min-width:0\">\n            <span style=\"font-family:var(--font-heading);font-size:17px\">{{ d.ordem }}<\u002Fspan>\n            <span class=\"tag {{ d.tagClass }}\">{{ d.papel }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:13.5px;font-weight:600;flex-shrink:0\">{{ d.data }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ d.temFoto }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:relative;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-divider);background:var(--color-neutral-200);aspect-ratio:5/2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--color-neutral-600)\"><img alt=\"\" src=\"{{ d.fotoSr :100%;text-align:left;border:0;cursor:pointer;font-family:var(--font-body);font-size:14px;padding:11px 12px;border-radius:var(--radius-sm);background:{{ o.bg }};color:{{ o.cor }}\" onClick=\"{{ o.escolher }}\">{{ o.nome }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600);padding:10px 12px 4px\">Felinas<\u002Fdiv>\n        <sc-for list=\"{{ opcoesFelinas }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <button style=\"width:100%;text-align:left;border:0;cursor:pointer;font-family:var(--font-body);font-size:14px;padding:11px 12px;border-radius:var(--radius-sm);background:{{ o.bg }};color:{{ o.cor }}\" onClick=\"{{ o.escolher }}\">{{ o.nome }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"border-top:1px solid var(--color-divider);margin:6px 0 0;padding-top:4px\">\n          <button style=\"width:100%;text-align:left;border:0;cursor:pointer;font-family:var(--font-body);font-size:14px;padding:11px 12px;border-radius:var(--radius-sm);background:{{ outraBg }};color:{{ outraCor }}\" onClick=\"{{ escolherOutra }}\">Outra\u2026<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ vacinaOutra }}\">\n    <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:18px\">\n      <div class=\"field\" style=\"margin-bottom:12px\"><label>Nome da nova vacina<\u002Flabel>\n        <input class=\"input\" value=\"{{ outraNome }}\" onChange=\"{{ setOutraNome }}\" placeholder=\"Ex.: Leptospirose L4\" style=\"width:100%;background:var(--color-neutral-100)\"><\u002Fdiv>\n      <div class=\"field\" style=\"margin-bottom:12px\"><label>Para qual esp\u00e9cie<\u002Flabel>\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"tag {{ clsOutraCanina }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px;background:{{ bgOutraCanina }}\" onClick=\"{{ setOutraCanina }}\">Canina<\u002Fbutton>\n          <button class=\"tag {{ clsOutraFelina }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px;background:{{ bgOutraFelina }}\" onClick=\"{{ setOutraFelina }}\">Felina<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary\" style=\"border-radius:999px;height:40px\" onClick=\"{{ adicionarVacina }}\">Adicionar \u00e0 lista<\u002Fbutton>\n      <p style=\"font-size:12px;color:var(--color-accent-2-900);margin:10px 0 0\">Depois de adicionada, ela passa a aparecer na lista suspensa.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vinculandoDose }}\">\n    <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:18px\">\n      <div style=\"font-size:13.5px;font-weight:600;margin-bottom:3px\">Refor\u00e7o deste esquema<\u002Fdiv>\n      <p style=\"font-size:12.5px;color:var(--color-accent-2-900);margin:0\">{{ textoVinculo }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ escolherEsquema }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-bottom:18px\">\n      <label style=\"display:block;font-size:12px;margin-bottom:8px\">Tipo de aplica\u00e7\u00e3o<\u002Flabel>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <button style=\"border-radius:999px;border:1px solid {{ bordaUnica }};background:{{ bgUnica }};color:{{ corUnica }};padding:9px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ setEsquemaUnica }}\">Dose \u00fanica<\u002Fbutton>\n        <button style=\"border-radius:999px;border:1px solid {{ bordaReforco }};background:{{ bgReforco }};color:{{ corReforco }};padding:9px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ setEsquemaReforco }}\">Dose com refor\u00e7o<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\ button>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ comFoto }}\">\n    <div style=\"width:100%;aspect-ratio:5/2;border-radius:var(--radius-lg);background:var(--color-neutral-300);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--color-neutral-700);margin-bottom:6px;position:relative\"><img alt=\"\" src=\"{{ loteFotoSrc }}\" style=\"position:absolute;left:0;top:0;width:100%;height:100%;border-radius:inherit;object-fit:cover;display:{{ loteFotoDisp }};pointer-events:none\">\n      <button class=\"btn btn-secondary\" style=\"position:absolute;bottom:10px;right:10px;background:var(--color-neutral-100);font-size:12px;border-radius:999px;padding:6px 12px\" onClick=\"{{ refazerFoto }}\">Refazer<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 18px\">A foto fica anexada ao registro como comprovante.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:14px\"><label>Veterin\u00e1rio respons\u00e1vel<\u002Flabel><input class=\"input\" value=\"{{ vacVet }}\" onChange=\"{{ setVacVet }}\" placeholder=\"Nome e CRMV\" autocomplete=\"off\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:14px\"><label>Cl\u00ednica<\u002Flabel><input class=\"input\" value=\"{{ vacClinica }}\" onChange=\"{{ setVacClinica }}\" placeholder=\"Onde foi aplicada\" autocomplete=\"off\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:26px\"><label>Observa\u00e7\u00f5es<\u002Flabel><textarea class=\"input\" value=\"{{ vacObs }}\" onChange=\"{{ setVacObs }}\" placeholder=\"Rea\u00e7\u00f5es, orienta\u00e7\u00f5es\u2026\" style=\"width:100%;border-radius:var(--radius-lg);min-height:78px\"><\u002Ftextarea><\u002Fdiv>\n\n  <sc-if value=\"{{ bloqueioVacina }}\">\n    <div style=\"background:var(--color-accent-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px\">\n      <div style=\"font-size:13.5px;font-weight:600;marg :10.5px;color:var(--color-neutral-600)\">emitido em {{ hojeStr }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Vacinas registradas<\u002Fdiv>\n    <div style=\"margin-bottom:20px\">\n      <div style=\"display:flex;gap:8px;padding:0 0 6px;border-bottom:1px solid var(--color-divider);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600)\">\n        <span style=\"flex:1.4;padding-left:10px\">Dose<\u002Fspan><span style=\"flex:1\">Aplicada<\u002Fspan><span style=\"flex:1\">Lote<\u002Fspan><span style=\"flex:1.6\">Respons\u00e1vel<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ vacinas }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <div style=\"border-bottom:1px solid var(--color-neutral-200);padding:9px 0\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n            <span style=\"font-size:13px;font-weight:600\">{{ v.nome }}<\u002Fspan>\n            <span style=\"font-size:10.5px;color:var(--color-neutral-600)\">{{ v.esquemaLabel }} \u00b7 {{ v.status }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:10.5px;color:var(--color-neutral-600);margin-bottom:5px\">{{ v.proximaLabel }}<\u002Fdiv>\n          <sc-for list=\"{{ v.doses }}\" as=\"d\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:8px;font-size:11.5px;padding:3px 0\">\n              <span style=\"flex:1.4;padding-left:10px\">{{ d.ordem }}<\u002Fspan>\n              <span style=\"flex:1\">{{ d.data }}<\u002Fspan>\n              <span style=\"flex:1;font-family:ui-monospace,Menlo,monospace\">{{ d.lote }}<\u002Fspan>\n              <span style=\"flex:1.6\">{{ d.vet }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;letter-s
