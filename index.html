dius:var(--radius-md);padding:12px;text-align:center\">\n        <div style=\"font-family:var(--font-heading);font-size:22px;line-height:1\">{{ memorialNotas }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ rotuloNotas }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:12px;text-align:center\">\n        <div style=\"font-family:var(--font-heading);font-size:22px;line-height:1\">{{ memorialConsultas }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ rotuloConsultas }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px\">\n      <h4 style=\"font-family:var(--font-heading);font-size:18px;margin:0\">\u00c1lbum<\u002Fh4>\n      <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ totalFotosAlbum }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px\">\n      <sc-for list=\"{{ album }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"border-radius:var(--radius-md);overflow:hidden;height:118px;display:flex;align-items:flex-end;padding:9px 10px;background:{{ f.fundo }}\">\n          <span style=\"font-size:10.5px;color:#f9f4ed;background:rgba(20,18,16,.55);border-radius:999px;padding:3px 9px\">{{ f.legenda }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button style=\"border:2px dashed var(--color-accent-2-500);background:transparent;border-radius:var(--radius-md);height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--color-accent-2-800);font-family:var(--font-body);font-size:12px\" onClick=\"{{ adicionarFotoAlbum }}\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n        Adicionar foto<\u002Fbutton>\n    <\u002Fdiv>\n\n    <h4 style=\"font-family:var(--font-heading);font-size:18px;margin:0 0 12px\">Lembran\u00e7as<\u002Fh4>\n    <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:18px\">\n      <sc-for list=\"{{ lembrancas }}\" as=\"l\" hint-placeholder-count=\"2\">\n        <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px\">\n          <div style=\"font-size:12px;color:var(--color-neutral-700);margin-bottom:4px\">{{ l.data }}<\u002Fdiv>\n          <p style=\"font-size:14px;margin:0;text-wrap:pretty\">{{ l.texto }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"field\" style=\"margin-bottom:10px\"><label>Escrever uma lembran\u00e7a<\u002Flabel>\n      <textarea class=\"input\" style=\"width:100%;border-radius:var(--radius-lg);min-height:78px\" value=\"{{ lembrancaInput }}\" onChange=\"{{ setLembrancaInput }}\" placeholder=\"Um dia, um jeito, uma mania\"><\u002Ftextarea><\u002Fdiv>\n    <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ salvarLembranca }}\">Guardar lembran\u00e7a<\u002Fbutton>\n    <button class=\"btn btn-secondary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ verHistoricoMemorial }}\">Ver o hist\u00f3rico completo<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ mostrarExtras }}\">\n<div style=\"flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg)\">\n<dc-import name=\"EsserePet Extras\" v=\"{{ extras }}\" hint-size=\"100%,100%\" style=\"flex:1;min-height:0;height:100%;display:flex;flex-direction:column;background:var(--color-bg)\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNovoPet }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:14px\" onClick=\"{{ irHome }}\">\u2190 Voltar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:29px;margin:0 0 22px\">Novo pet<\u002Fh2>\n  <div style=\"display:flex;justify-content:center;margin-bottom:26px\">\n    <button style=\"width:110px;height:110px;border-radius:999px;border:{{ bordaFotoNovoPet }};background:{{ bgFotoNovoPet }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:{{ corFotoNovoPet }};font-family:var(--font-body);font-size:11px\" onClick=\"{{ tirarFotoNovoPet }}\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n      {{ rotuloFotoNovoPet }}<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Nome<\u002Flabel>\n    <input class=\"input\" value=\"{{ novoNome }}\" onChange=\"{{ setNovoNome }}\" placeholder=\"Como voc\u00ea chama\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Esp\u00e9cie<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ segCanino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setCanino }}\">Canino<\u002Fbutton>\n      <button class=\"tag {{ segFelino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setFelino }}\">Felino<\u002Fbutton>\n      <button class=\"tag {{ segOutros }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setOutros }}\">Outros<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Sexo<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ clsMacho }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setMacho }}\">Macho<\u002Fbutton>\n      <button class=\"tag {{ clsFemea }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ setFemea }}\">F\u00eamea<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Ra\u00e7a<\u002Flabel>\n    <input class=\"input\" value=\"{{ novaRaca }}\" onChange=\"{{ setNovaRaca }}\" placeholder=\"SRD\" style=\"width:100%\"><\u002Fdiv>\n\n  <div class=\"field\" style=\"margin-bottom:10px\"><label>Data de refer\u00eancia<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ clsNascimento }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 14px\" onClick=\"{{ setNascimento }}\">Nascimento<\u002Fbutton>\n      <button class=\"tag {{ clsResgate }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 14px\" onClick=\"{{ setResgate }}\">Resgate / ado\u00e7\u00e3o<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:6px\"><input class=\"input\" type=\"date\" max=\"{{ hojeIso }}\" value=\"{{ novaData }}\" onChange=\"{{ setNovaData }}\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 18px\">A idade do pet \u00e9 calculada a partir dessa data e aparece na home, na ficha e no relat\u00f3rio.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:8px\"><label>Peso atual (kg)<\u002Flabel>\n    <input class=\"input\" value=\"{{ novoPeso }}\" onChange=\"{{ setNovoPeso }}\" placeholder=\"0,0\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 18px\">Este ser\u00e1 o primeiro registro do hist\u00f3rico de peso. Novos pesos entram pela aba Peso da caderneta.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:22px\"><label>Microchip (opcional)<\u002Flabel><input class=\"input\" value=\"{{ novoChip }}\" onChange=\"{{ setNovoChip }}\" placeholder=\"000 000 000 000 000\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n\n  <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:22px\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-800)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;margin-top:2px\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"><\u002Fpath><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z\"><\u002Fpath><\u002Fsvg>\n    <p style=\"font-size:12.5px;color:var(--color-accent-2-900);margin:0\">Ao salvar, uma caderneta de vacina\u00e7\u00e3o \u00e9 criada automaticamente para {{ novoNomeOuPet }}.<\u002Fp>\n  <\u002Fdiv>\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarPet }}\">Salvar e criar caderneta<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCadernetas }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:28px 20px 26px\">\n  <h2 style=\"font-family:var(--font-heading);font-size:29px;margin:0 0 4px\">Cadernetas<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 20px\">{{ textoCadernetas }}<\u002Fp>\n  <div class=\"ep-grid\">\n    <sc-for list=\"{{ petsView }}\" as=\"pet\" hint-placeholder-count=\"3\">\n      <button style=\"width:100%;text-align:left;border:0;border-radius:var(--radius-lg);padding:20px;cursor:pointer;font-family:var(--font-body);color:var(--color-text);box-shadow:var(--shadow-md);background:{{ pet.cardBg }}\" onClick=\"{{ pet.abrir }}\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:12px\">\n          <div style=\"background-image:{{ pet.fotoImg }};background-size:cover;background-position:center;width:56px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:21px;flex-shrink:0;background:{{ pet.chipBg }};color:{{ pet.corTexto }}\"><span style=\"visibility:{{ pet.letraVis }}\">{{ pet.iniciais }}<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-family:var(--font-heading);font-size:21px;line-height:1.15\">{{ pet.nome }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:{{ pet.corTexto }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ pet.subtitulo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"tag\" style=\"flex-shrink:0;font-weight:600;background:{{ pet.tagBg }};color:{{ pet.tagCor }};border:1px solid {{ pet.tagBorda }}\">{{ pet.statusLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;margin-bottom:12px;color:{{ pet.corTexto }}\">{{ pet.legenda }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <div style=\"flex:1;border-radius:var(--radius-md);padding:10px;background:{{ pet.chipBg }}\">\n            <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1\">{{ pet.totalVacinas }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:{{ pet.corTexto }}\">registros<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:2;border-radius:var(--radius-md);padding:10px;background:{{ pet.chipBg }}\">\n            <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1\">{{ pet.proximaNome }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:{{ pet.corTexto }}\">{{ pet.proximaQuando }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n    <button class=\"btn btn-secondary btn-block\" style=\"height:52px;border-radius:999px;gap:8px;grid-column:1/-1\" onClick=\"{{ irNovoPet }}\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n      Novo pet<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCaderneta }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto\">\n  <div style=\"background:var(--color-accent-2-200);padding:28px 20px 22px\">\n    <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:10px;color:var(--color-accent-2-800)\" onClick=\"{{ irHome }}\">\u2190 Meus pets<\u002Fbutton>\n    <div style=\"display:flex;align-items:center;gap:15px\">\n      <div style=\"background-image:{{ petFotoImg }};background-size:cover;background-position:center;width:78px;height:78px;border-radius:999px;background:var(--color-accent-200);border:3px solid var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:27px;color:var(--color-accent-800);flex-shrink:0\"><span style=\"visibility:{{ petLetraVis }}\">{{ petIniciais }}<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 2px\">{{ petNome }}<\u002Fh2>\n        <div style=\"font-size:13px;color:var(--color-accent-2-800)\">{{ petSubtitulo }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-icon\" style=\"border-radius:999px;background:var(--color-neutral-100);flex-shrink:0\" onClick=\"{{ irEditarPet }}\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:9px;margin-top:16px\">\n      <div style=\"flex:1;background:var(--color-neutral-100);border-radius:var(--radius-md);padding:10px 12px\">\n        <div style=\"font-family:var(--font-heading);font-size:20px;line-height:1\">{{ petTotalVacinas }}<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--color-neutral-700)\">registros<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:2;background:var(--color-neutral-100);border-radius:var(--radius-md);padding:10px 12px\">\n        <div style=\"font-family:var(--font-heading);font-size:20px;line-height:1\">{{ petProximaData }}<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--color-neutral-700);text-wrap:pretty\">{{ petProximaLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:22px 20px 26px\">\n    <sc-if value=\"{{ modoHistorico }}\">\n      <div style=\"background:var(--color-accent-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px\">\n        <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Caderneta em modo hist\u00f3rico<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--color-accent-900);margin-bottom:10px\">Voc\u00ea continua vendo tudo e anotando peso e ocorr\u00eancias. Para registrar novas vacinas, reative o Premium.<\u002Fdiv>\n        <button class=\"btn btn-primary\" style=\"border-radius:999px;height:38px;font-size:13px\" onClick=\"{{ irPlanos }}\">Reativar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ petFalecido }}\">\n      <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px\">\n        <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">Hist\u00f3rico de {{ petNome }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--color-accent-2-900);margin-bottom:10px\">Somente leitura. Os lembretes foram encerrados.<\u002Fdiv>\n        <button class=\"btn btn-secondary\" style=\"border-radius:999px;height:38px;font-size:13px\" onClick=\"{{ voltarMemorial }}\">Voltar ao memorial<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ petVivo }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:10px;margin-bottom:24px\">\n      <button class=\"btn btn-primary\" style=\"flex:1;height:46px;border-radius:999px;gap:8px\" onClick=\"{{ irNovaVacina }}\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n        Registrar vacina<\u002Fbutton>\n      <button class=\"btn btn-secondary btn-icon\" style=\"width:46px;height:46px;border-radius:999px\" onClick=\"{{ irCompartilhar }}\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8\"><\u002Fpath><path d=\"m16 6-4-4-4 4\"><\u002Fpath><path d=\"M12 2v14\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;gap:8px;overflow:auto;margin:0 -20px 18px;padding:0 20px 4px\">\n      <sc-for list=\"{{ abas }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button style=\"flex-shrink:0;border:1px solid var(--color-divider);border-radius:999px;padding:9px 15px;cursor:pointer;font-family:var(--font-body);font-size:13.5px;background:{{ t.bg }};color:{{ t.cor }}\" onClick=\"{{ t.abrir }}\">{{ t.nome }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ semVacinas }}\">\n      <div style=\"border:2px dashed var(--color-neutral-400);border-radius:var(--radius-lg);padding:26px 20px;text-align:center;color:var(--color-neutral-700)\">\n        <div style=\"font-family:var(--font-heading);font-size:18px;color:var(--color-text);margin-bottom:4px\">Caderneta criada<\u002Fdiv>\n        <p style=\"font-size:13px;margin:0 0 14px\">Ainda n\u00e3o h\u00e1 vacinas registradas para {{ petNome }}.<\u002Fp>\n        <button class=\"btn btn-primary\" style=\"border-radius:999px\" onClick=\"{{ irNovaVacina }}\">Registrar a primeira<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ abaVacinas }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <sc-for list=\"{{ vacinas }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px\">\n          <div style=\"display:flex;align-items:flex-start;gap:12px;margin-bottom:8px\">\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1.15\">{{ v.nome }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:var(--color-neutral-700)\">{{ v.esquemaLabel }} \u00b7 {{ v.dosesLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <span class=\"tag {{ v.tagClass }}\" style=\"flex-shrink:0\">{{ v.status }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ v.doses }}\" as=\"d\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--color-divider);font-size:12.5px\">\n              <span style=\"width:58px;flex-shrink:0;color:var(--color-neutral-600)\">{{ d.ordem }}<\u002Fspan>\n              <span style=\"font-weight:600;flex-shrink:0\">{{ d.data }}<\u002Fspan>\n              <span style=\"color:var(--color-neutral-700);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Lote {{ d.lote }} \u00b7 {{ d.vet }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--color-divider);padding-top:10px;margin-top:2px\">\n            <span style=\"font-size:12.5px;color:{{ v.proximaCor }}\">{{ v.proximaLabel }}<\u002Fspan>\n            <button class=\"btn btn-ghost\" style=\"font-size:13px;padding:6px 10px;flex-shrink:0\" onClick=\"{{ v.abrir }}\">Abrir registro<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ abaPeso }}\">\n    <div>\n      <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:18px;display:flex;align-items:flex-end;gap:14px\">\n        <div><div style=\"font-size:12px;color:var(--color-accent-2-900)\">Peso atual<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:32px;line-height:1\">{{ pesoAtual }} kg<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;text-align:right;font-size:12.5px;color:var(--color-accent-2-900);padding-bottom:4px\">{{ pesoVariacao }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px 14px 10px;margin-bottom:14px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px\">\n          <span style=\"font-size:13px;font-weight:600\">Hist\u00f3rico de peso<\u002Fspan>\n          <span style=\"font-size:11.5px;color:var(--color-neutral-600)\">faixa ideal {{ faixaLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:100%;height:140px\">{{ grafico }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;background:{{ alertaBg }}\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ alertaCor }}\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;margin-top:2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5\"><\u002Fpath><path d=\"M12 16h.01\"><\u002Fpath><\u002Fsvg>\n        <div><div style=\"font-size:14px;font-weight:600;margin-bottom:2px\">{{ alertaTitulo }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:{{ alertaCor }}\">{{ alertaTexto }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;margin-bottom:18px\">\n        <div class=\"field\" style=\"flex:1\"><label>Peso m\u00ednimo ideal (kg)<\u002Flabel>\n          <input class=\"input\" value=\"{{ minInput }}\" onChange=\"{{ setMinInput }}\" placeholder=\"0,0\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><label>Peso m\u00e1ximo ideal (kg)<\u002Flabel>\n          <input class=\"input\" value=\"{{ maxInput }}\" onChange=\"{{ setMaxInput }}\" placeholder=\"0,0\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;margin-bottom:18px\">\n        <sc-for list=\"{{ pesos }}\" as=\"w\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:14px;padding:12px 2px;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"width:78px;flex-shrink:0;font-size:12.5px;color:var(--color-neutral-700)\">{{ w.data }}<\u002Fdiv>\n            <div style=\"flex:1;font-size:15px;font-weight:600\">{{ w.valor }} kg<\u002Fdiv>\n            <span class=\"tag tag-neutral\">{{ w.delta }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:flex-end\">\n        <div class=\"field\" style=\"flex:1\"><label>Novo peso (kg)<\u002Flabel>\n          <input class=\"input\" value=\"{{ pesoInput }}\" onChange=\"{{ setPesoInput }}\" placeholder=\"0,0\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n        <button class=\"btn btn-primary\" style=\"height:40px;border-radius:999px\" onClick=\"{{ salvarPeso }}\">Registrar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ abaNotas }}\">\n    <div>\n      <p style=\"font-size:13px;color:var(--color-neutral-700);margin:0 0 14px\">Sintomas, rea\u00e7\u00f5es, consultas \u2014 o que voc\u00ea quiser lembrar e mostrar ao veterin\u00e1rio.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:20px\">\n        <sc-for list=\"{{ notas }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px\">\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:5px\">{{ n.data }}<\u002Fdiv>\n            <p style=\"font-size:14px;margin:0\">{{ n.texto }}<\u002Fp>\n            <sc-if value=\"{{ n.temFoto }}\">\n              <div style=\"margin-top:10px;border-radius:var(--radius-md);overflow:hidden;height:170px;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-300));background-image:{{ n.fotoImg }};background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:10px 12px\">\n                <span style=\"font-size:11px;color:var(--color-neutral-100);background:rgba(32,30,29,.45);border-radius:999px;padding:4px 10px\">{{ n.legendaFoto }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"field\" style=\"margin-bottom:10px\"><label>Nova anota\u00e7\u00e3o<\u002Flabel>\n        <textarea class=\"input\" style=\"width:100%;border-radius:var(--radius-lg);min-height:84px\" value=\"{{ notaInput }}\" onChange=\"{{ setNotaInput }}\" placeholder=\"Ex.: vomitou depois do passeio da manh\u00e3\"><\u002Ftextarea><\u002Fdiv>\n      <button style=\"width:100%;height:78px;border:2px dashed var(--color-neutral-400);border-radius:var(--radius-lg);background:{{ notaFotoBg }};background-image:{{ notaFotoImg }};background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:var(--font-body);font-size:13.5px;color:var(--color-accent-800);margin-bottom:12px\" onClick=\"{{ anexarFotoNota }}\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n        {{ rotuloFotoNota }}<\u002Fbutton>\n      <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px;margin-top:0\" onClick=\"{{ salvarNota }}\">Salvar anota\u00e7\u00e3o<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ abaBanho }}\">\n    <div>\n      <sc-if value=\"{{ premiumBloqueado }}\">\n        <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);font-size:17px;margin-bottom:4px\">Assine o plano premium para desbloquear essa fun\u00e7\u00e3o<\u002Fdiv>\n          <p style=\"font-size:13px;color:var(--color-accent-2-900);margin:0 0 12px\">Banho, tosa, antipulgas e verm\u00edfugo com lembrete autom\u00e1tico a cada ciclo.<\u002Fp>\n          <button class=\"btn btn-primary\" style=\"border-radius:999px;height:40px;font-size:13px\" onClick=\"{{ irPlanos }}\">Assinar Premium<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px\">\n        <sc-for list=\"{{ cuidados }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px\">\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:8px\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:15px;font-weight:600\">{{ c.nome }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--color-neutral-700)\">\u00daltimo: {{ c.ultimo }} \u00b7 a cada {{ c.intervalo }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span class=\"tag {{ c.tagClass }}\">{{ c.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"flex:1;height:6px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden\">\n                <div style=\"height:100%;border-radius:999px;width:{{ c.progresso }};background:{{ c.barra }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-secondary\" style=\"border-radius:999px;height:34px;font-size:12.5px;padding:0 14px\" onClick=\"{{ c.registrar }}\">Fiz hoje<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px\">\n              <span style=\"font-size:11.5px;color:var(--color-neutral-600)\">{{ c.proximo }}<\u002Fspan>\n              <sc-if value=\"{{ c.naoConfirmando }}\">\n                <button class=\"btn btn-ghost\" style=\"font-size:12px;padding:4px 0;color:var(--color-accent-700)\" onClick=\"{{ c.pedirExclusao }}\">Excluir<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ c.confirmando }}\">\n              <div style=\"background:var(--color-accent-200);border-radius:var(--radius-md);padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                <span style=\"flex:1;min-width:150px;font-size:12.5px;color:var(--color-accent-900)\">Excluir {{ c.nome }} e os lembretes dele?<\u002Fspan>\n                <button class=\"btn btn-ghost\" style=\"font-size:12.5px\" onClick=\"{{ c.cancelarExclusao }}\">Manter<\u002Fbutton>\n                <button class=\"btn btn-primary\" style=\"border-radius:999px;height:34px;font-size:12.5px;padding:0 14px\" onClick=\"{{ c.excluir }}\">Excluir<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h4 style=\"font-family:var(--font-heading);font-size:17px;margin:0 0 10px\">Novo cuidado<\u002Fh4>\n      <div style=\"display:flex;gap:10px;margin-bottom:10px\">\n        <div class=\"field\" style=\"flex:2\"><label>O que \u00e9<\u002Flabel>\n          <input class=\"input\" value=\"{{ cuidadoNome }}\" onChange=\"{{ setCuidadoNome }}\" placeholder=\"Ex.: Corte de unhas\" style=\"width:100%\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><label>A cada (dias)<\u002Flabel>\n          <input class=\"input\" value=\"{{ cuidadoDias }}\" onChange=\"{{ setCuidadoDias }}\" placeholder=\"30\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ salvarCuidado }}\">Adicionar com lembrete<\u002Fbutton>\n      <p style=\"font-size:12px;color:var(--color-neutral-600);margin:10px 0 0\">O app avisa quando o prazo chegar e recalcula a partir da data em que voc\u00ea marcar como feito.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ abaMedicacao }}\">\n    <div>\n      <sc-if value=\"{{ premiumBloqueado }}\">\n        <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px\">\n          <div style=\"font-family:var(--font-heading);font-size:17px;margin-bottom:4px\">Assine o plano premium para desbloquear essa fun\u00e7\u00e3o<\u002Fdiv>\n          <p style=\"font-size:13px;color:var(--color-accent-2-900);margin:0 0 12px\">Cadastre a receita e receba o lembrete de cada dose no hor\u00e1rio certo.<\u002Fp>\n          <button class=\"btn btn-primary\" style=\"border-radius:999px;height:40px;font-size:13px\" onClick=\"{{ irPlanos }}\">Assinar Premium<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ temMedicacaoAtiva }}\">\n        <div style=\"background:var(--color-accent-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px\">\n            <span style=\"font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-900)\">Pr\u00f3ximas doses<\u002Fspan>\n            <span style=\"font-size:11.5px;color:var(--color-accent-900)\">agora {{ agoraStr }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ proximasDoses }}\" as=\"d\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--color-accent-300)\">\n              <span style=\"font-family:var(--font-heading);font-size:19px;line-height:1.15;width:62px;flex-shrink:0\">{{ d.hora }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0;font-size:12.5px;color:var(--color-accent-900)\">{{ d.detalhe }}<\u002Fspan>\n              <span class=\"tag {{ d.tagClass }}\" style=\"flex-shrink:0\">{{ d.quando }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px\">\n        <sc-for list=\"{{ medicacoes }}\" as=\"m\" hint-placeholder-count=\"2\">\n          <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px;opacity:{{ m.opacidade }}\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px\">\n              <div style=\"font-size:15px;font-weight:600\">{{ m.nome }}<\u002Fdiv>\n              <span class=\"tag {{ m.tagClass }}\">{{ m.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:4px\">{{ m.dose }} \u00b7 a cada {{ m.horas }}h<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:8px\">{{ m.periodo }}<\u002Fdiv>\n            <sc-if value=\"{{ m.temUltima }}\">\n              <div style=\"font-size:12.5px;color:var(--color-neutral-800)\">{{ m.ultimaTxt }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ m.ativa }}\">\n              <div style=\"font-size:13px;font-weight:600;color:var(--color-accent-700);margin:2px 0 10px\">{{ m.proximaTxt }}<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button class=\"btn btn-secondary\" style=\"border-radius:999px;height:34px;font-size:12.5px;padding:0 14px\" onClick=\"{{ m.registrarDose }}\">Dei a dose<\u002Fbutton>\n                <button class=\"btn btn-ghost\" style=\"font-size:12.5px\" onClick=\"{{ m.encerrar }}\">Encerrar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ m.encerrada }}\">\n              <div style=\"font-size:12px;color:var(--color-neutral-600)\">{{ m.motivoFim }} \u00b7 registro mantido no hist\u00f3rico, sem edi\u00e7\u00e3o<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h4 style=\"font-family:var(--font-heading);font-size:17px;margin:0 0 10px\">Nova medica\u00e7\u00e3o<\u002Fh4>\n      <p style=\"font-size:12.5px;color:var(--color-neutral-700);margin:0 0 12px\">Preencha conforme a receita do veterin\u00e1rio.<\u002Fp>\n      <div class=\"field\" style=\"margin-bottom:12px\"><label>Medicamento<\u002Flabel>\n        <input class=\"input\" value=\"{{ medNome }}\" onChange=\"{{ setMedNome }}\" placeholder=\"Ex.: Amoxicilina 250mg\" style=\"width:100%\"><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-bottom:12px\">\n        <div class=\"field\" style=\"flex:2\"><label>Dose<\u002Flabel>\n          <input class=\"input\" value=\"{{ medDose }}\" onChange=\"{{ setMedDose }}\" placeholder=\"1 comprimido\" style=\"width:100%\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><label>A cada (h)<\u002Flabel>\n          <input class=\"input\" value=\"{{ medHoras }}\" onChange=\"{{ setMedHoras }}\" placeholder=\"12\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-bottom:14px\">\n        <div class=\"field\" style=\"flex:1\"><label>Dura\u00e7\u00e3o (dias)<\u002Flabel>\n          <input class=\"input\" value=\"{{ medDias }}\" onChange=\"{{ setMedDias }}\" placeholder=\"7\" inputmode=\"numeric\" style=\"width:100%\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><label>Primeira dose<\u002Flabel>\n          <input class=\"input\" type=\"time\" value=\"{{ medHora }}\" aria-label=\"Hor\u00e1rio da 1\u00aa dose\" onChange=\"{{ setMedHora }}\" style=\"width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px\" onClick=\"{{ salvarMedicacao }}\">Salvar e ativar lembretes<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isVacina }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 20px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCaderneta }}\">\u2190 Caderneta de {{ petNome }}<\u002Fbutton>\n  <div style=\"display:flex;align-items:flex-start;gap:12px;margin-bottom:20px\">\n    <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0;flex:1\">{{ vacNome }}<\u002Fh2>\n    <span class=\"tag {{ vacTagClass }}\" style=\"margin-top:6px\">{{ vacStatus }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:4px 16px;margin-bottom:22px\">\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-divider)\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Esquema<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ vacEsquema }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-divider)\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">\u00daltima aplica\u00e7\u00e3o<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ vacData }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 0\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">{{ vacProximaLabel }}<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ vacProxima }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ podeRegistrarDose }}\">\n    <div style=\"background:{{ fundoNovaDose }};border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:22px\">\n      <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">{{ tituloNovaDose }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:var(--color-neutral-800);margin-bottom:12px;text-wrap:pretty\">{{ textoNovaDose }}<\u002Fdiv>\n      <button class=\"btn btn-primary btn-block\" style=\"height:48px;border-radius:999px;gap:8px\" onClick=\"{{ registrarDoseDesta }}\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n        Registrar nova dose de {{ vacNome }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <h4 style=\"font-family:var(--font-heading);font-size:17px;margin:0 0 4px\">Hist\u00f3rico de doses<\u002Fh4>\n  <p style=\"font-size:12.5px;color:var(--color-neutral-700);margin:0 0 12px\">{{ vacDosesResumo }}<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <sc-for list=\"{{ vacDoses }}\" as=\"d\" hint-placeholder-count=\"2\">\n      <div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px;background:{{ d.fundo }}\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px\">\n          <div style=\"display:flex;align-items:baseline;gap:8px;min-width:0\">\n            <span style=\"font-family:var(--font-heading);font-size:17px\">{{ d.ordem }}<\u002Fspan>\n            <span class=\"tag {{ d.tagClass }}\">{{ d.papel }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:13.5px;font-weight:600;flex-shrink:0\">{{ d.data }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ d.temFoto }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-divider);background:var(--color-neutral-200);background-image:{{ d.fotoImg }};background-size:cover;background-position:center;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--color-neutral-600)\">\n            <sc-if value=\"{{ d.semFotoReal }}\">\n            <svg width=\"26\" height=\"26\" viewBox=\  }}\" onClick=\"{{ setOutraFelina }}\">Felina<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary\" style=\"border-radius:999px;height:40px\" onClick=\"{{ adicionarVacina }}\">Adicionar \u00e0 lista<\u002Fbutton>\n      <p style=\"font-size:12px;color:var(--color-accent-2-900);margin:10px 0 0\">Depois de adicionada, ela passa a aparecer na lista suspensa.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vinculandoDose }}\">\n    <div style=\"background:var(--color-accent-2-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:18px\">\n      <div style=\"font-size:13.5px;font-weight:600;margin-bottom:3px\">Refor\u00e7o deste esquema<\u002Fdiv>\n      <p style=\"font-size:12.5px;color:var(--color-accent-2-900);margin:0\">{{ textoVinculo }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ escolherEsquema }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-bottom:18px\">\n      <label style=\"display:block;font-size:12px;margin-bottom:8px\">Tipo de aplica\u00e7\u00e3o<\u002Flabel>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <button style=\"border-radius:999px;border:1px solid {{ bordaUnica }};background:{{ bgUnica }};color:{{ corUnica }};padding:9px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ setEsquemaUnica }}\">Dose \u00fanica<\u002Fbutton>\n        <button style=\"border-radius:999px;border:1px solid {{ bordaReforco }};background:{{ bgReforco }};color:{{ corReforco }};padding:9px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ setEsquemaReforco }}\">Dose com refor\u00e7o<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:12px;color:var(--color-neutral-600);margin:8px 0 0\">{{ textoEsquema }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;gap:12px;margin-bottom:18px\">\n    <div class=\"field\" style=\"flex:1;min-width:0\"><label>Data de apl display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--color-neutral-700);margin-bottom:6px;position:relative\">\n      <button class=\"btn btn-secondary\" style=\"position:absolute;bottom:10px;right:10px;background:var(--color-neutral-100);font-size:12px;border-radius:999px;padding:6px 12px\" onClick=\"{{ refazerFoto }}\">Refazer<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 18px\">A foto fica anexada ao registro como comprovante.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:14px\"><label>Veterin\u00e1rio respons\u00e1vel<\u002Flabel><input class=\"input\" value=\"{{ vacVet }}\" onChange=\"{{ setVacVet }}\" placeholder=\"Nome e CRMV\" autocomplete=\"off\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:14px\"><label>Cl\u00ednica<\u002Flabel><input class=\"input\" value=\"{{ vacClinica }}\" onChange=\"{{ setVacClinica }}\" placeholder=\"Onde foi aplicada\" autocomplete=\"off\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:26px\"><label>Observa\u00e7\u00f5es<\u002Flabel><textarea class=\"input\" value=\"{{ vacObs }}\" onChange=\"{{ setVacObs }}\" placeholder=\"Rea\u00e7\u00f5es, orienta\u00e7\u00f5es\u2026\" style=\"width:100%;border-radius:var(--radius-lg);min-height:78px\"><\u002Ftextarea><\u002Fdiv>\n\n  <sc-if value=\"{{ bloqueioVacina }}\">\n    <div style=\"background:var(--color-accent-200);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px\">\n      <div style=\"font-size:13.5px;font-weight:600;margin-bottom:2px\">{{ tituloBloqueioVacina }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:var(--color-accent-900);margin-bottom:10px\">{{ textoBloqueioVacina }}<\u002Fdiv>\n      <button class=\"btn btn-primary\" style=\"border-radius:999px;height:40px;font-size:13px\" onClick=\"{{ irPlanos }}\">Ver planos<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarVacina }}\">Salvar na caderneta<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCompartilhar }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 20px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCaderneta }}\">\u2190 Voltar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 4px\">Compartilhar caderneta<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 22px\">Envie o hist\u00f3rico de {{ petNome }} para a cl\u00ednica, o hotel ou o novo tutor.<\u002Fp>\n\n  <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-md);margin-bottom:24px\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n      <div style=\"background-image:{{ petFotoImg }};background-size:cover;background-position:center;width:44px;height:44px;border-radius:999px;background:var(--color-accent-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:16px;color:var(--color-accent-800)\"><span style=\"visibility:{{ petLetraVis }}\">{{ petIniciais }}<\u002Fspan><\u002Fdiv>\n      <div><div style=\"font-family:var(--font-heading);font-size:17px\">{{ petNome }}<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ petTotalVacinas }} registros \u00b7 atualizado hoje<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <button class=\"btn btn-primary btn-block\" style=\"height:50px;border-radius:999px;margin-top:0\" onClick=\"{{ irExportar }}\">Gerar folha de exporta\u00e7\u00e3o<\u002Fbutton>\n\n  <\u002Fdiv>\n<\u002Fdiv>
