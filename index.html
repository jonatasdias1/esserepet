         <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:15px;font-weight:600;margin-bottom:2px\">{{ d.hora }} \u00b7 {{ d.nome }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:var(--color-accent-900)\">{{ d.detalhe }} \u00b7 {{ d.quando }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ d.podeDar }}\">\n              <button class=\"btn btn-primary\" style=\"border-radius:999px;height:38px;font-size:13px;padding:0 14px;flex-shrink:0\" onClick=\"{{ d.darDose }}\">Dei a dose<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ d.naoPodeDar }}\">\n              <span class=\"tag {{ d.tagClass }}\" style=\"flex-shrink:0\">{{ d.quando }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:14px;background:var(--color-neutral-900);border-radius:var(--radius-lg);padding:13px 15px;display:flex;gap:12px;align-items:flex-start\">\n        <div style=\"width:34px;height:34px;border-radius:9px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"4\" r=\"2\"><\u002Fcircle><circle cx=\"18\" cy=\"8\" r=\"2\"><\u002Fcircle><circle cx=\"20\" cy=\"16\" r=\"2\"><\u002Fcircle><path d=\"M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n            <span style=\"font-size:12px;color:var(--color-neutral-400)\">EsserePet<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--color-neutral-500)\">{{ pushQuando }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;font-weight:600;color:var(--color-neutral-100)\">{{ pushTitulo }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-400)\">{{ pushTexto }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsc-if>\n  <sc-if value=\"{{ temCuidadosAlerta }}\">\n    <div style=\"font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px\">Banho e cuidados<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:22px\">\n      <sc-for list=\"{{ cuidadosAlerta }}\" as=\"c\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;align-items:center;gap:13px;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:13px 15px\">\n          <button style=\"all:unset;flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:13px\" onClick=\"{{ c.abrir }}\">\n            <span style=\"width:44px;height:44px;border-radius:999px;background:var(--color-accent-2-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-2-800);flex-shrink:0\">{{ c.iniciais }}<\u002Fspan>\n            <span style=\"flex:1;min-width:0;display:block\">\n              <span style=\"display:block;font-size:15px;font-weight:600;margin-bottom:2px\">{{ c.nome }} \u00b7 {{ c.petNome }}<\u002Fspan>\n              <span style=\"display:block;font-size:12.5px;color:var(--color-neutral-700)\">{{ c.detalhe }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <button class=\"btn btn-secondary\" style=\"border-radius:999px;height:36px;font-size:12.5px;padding:0 14px;flex-shrink:0\" onClick=\"{{ c.fizHoje }}\">Fiz hoje<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px\">Vacinas<\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <sc-for list=\"{{ proximas }}\" as=\"p\" hint-placeholder-count=\"3\">\n      <button style=\"display:flex;gap:13px;width:100%;text-align:left;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:15px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ p.abrir }}\">\n        <div style=\"background-image:{{ p.fotoImg }};background-size:cover;background-position:center;width:44px;height:44px;border-radius:999px;background:var(--color-accent-2-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:15px;color:var(--color-accent-2-800);flex-shrink:0\"><span style=\"visibility:{{ p.letraVis }}\">{{ p.iniciais }}<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:2px\">{{ p.vacina }} \u00b7 {{ p.petNome }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:8px\">{{ p.detalhe }}<\u002Fdiv>\n          <span class=\"tag {{ p.tagClass }}\">{{ p.status }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPerfil }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 20px 30px\">\n  <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px\">\n    <div style=\"background-image:{{ tutorFotoImg }};background-size:cover;background-position:center;width:96px;height:96px;border-radius:999px;background:var(--color-accent-2-300);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:32px;color:var(--color-accent-2-800);margin-bottom:12px\"><span style=\"visibility:{{ tutorLetraVis }}\">{{ tutorIniciais }}<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:var(--font-heading);font-size:25px;margin:0 0 2px\">{{ tutorNome }}<\u002Fh2>\n    <div style=\"font-size:13px;color:var(--color-neutral-700);margin-bottom:10px;white-space:nowrap\">{{ tutorUsuario }} \u00b7 {{ petsLabel }}<\u002Fdiv>\n    <span class=\"tag {{ planoTagClass }}\" style=\"margin-bottom:14px\">{{ planoLabel }}<\u002Fspan>\n    <button class=\"btn btn-secondary\" style=\"border-radius:999px;height:42px;gap:8px\" onClick=\"{{ irEditarPerfil }}\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>\n      Editar perfil<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:4px 16px;margin-bottom:22px\">\n    <div style=\"display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--color-divider)\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">E-mail<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ tutorEmail }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--color-divider)\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Telefone<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ tutorTelefone }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;padding:13px 0\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Entrar com biometria<\u002Fspan>\n      <button style=\"width:50px;height:29px;border-radius:999px;border:0;cursor:pointer;padding:3px;display:flex;justify-content:{{ bioJustify }};background:{{ bioBg }}\" onClick=\"{{ toggleBio }}\"><span style=\"width:23px;height:23px;border-radius:999px;background:#fff;display:block\"><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--color-divider)\"><span style=\"font-size:13px;color:var(--color-neutral-700)\">Tema<\u002Fspan>\n      <div style=\"display:flex;gap:4px;background:var(--color-neutral-200);border-radius:999px;padding:3px\">\n        <sc-for list=\"{{ temas }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button style=\"border:0;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--font-body);font-size:12.5px;background:{{ t.bg }};color:{{ t.cor }}\" onClick=\"{{ t.escolher }}\">{{ t.nome }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"btn btn-secondary btn-block\" style=\"height:50px;border-radius:999px;justify-content:flex-start;padding-left:18px;gap:12px;margin-top:0\" onClick=\"{{ irContatos }}\">\n    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5.3 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg>\n    Veterin\u00e1rio e contatos de urg\u00eancia<\u002Fbutton>\n  <button class=\"btn btn-secondary btn-block\" style=\"height:50px;border-radius:999px;justify-content:flex-start;padding-left:18px;gap:12px\" onClick=\"{{ irNovoPet }}\">\n    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n    Adicionar pet<\u002Fbutton>\n  <button class=\"btn btn-secondary btn-block\" style=\"height:50px;border-radius:999px;justify-content:flex-start;padding-left:18px;gap:12px\" onClick=\"{{ irPlanos }}\">\n    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l2.5 5.5 6 .8-4.4 4.2 1.1 6-5.2-2.9L6.8 19.5l1.1-6L3.5 9.3l6-.8Z\"><\u002Fpath><\u002Fsvg>\n    Plano e assinatura<\u002Fbutton>\n  <button class=\"btn btn-secondary btn-block\" style=\"height:50px;border-radius:999px;justify-content:flex-start;padding-left:18px;gap:12px\" onClick=\"{{ irPrivacidade }}\">\n    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l8 3v6c0 5-3.4 8.3-8 9.5C7.4 20.3 4 17 4 12V6Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n    Privacidade e meus dados<\u002Fbutton>\n  <sc-if value=\"{{ contaNaNuvem }}\">\n    <p style=\"font-size:12.5px;line-height:1.5;color:{{ corSinc }};text-align:center;margin:14px 6px 4px\">{{ textoSinc }}<\u002Fp>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ contaLocal }}\">\n    <p style=\"font-size:12.5px;line-height:1.5;color:var(--color-neutral-600);text-align:center;margin:14px 6px 4px\">Conta de demonstra\u00e7\u00e3o: nada fica salvo. Ao sair, tudo volta ao original.<\u002Fp>\n  <\u002Fsc-if>\n  <button class=\"btn btn-ghost btn-block\" style=\"height:48px\" onClick=\"{{ sair }}\">Sair da conta<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isExportar }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 20px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCompartilhar }}\">\u2190 Voltar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 4px\">Folha de exporta\u00e7\u00e3o<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 20px\">Vacinas de {{ petNome }} e as anota\u00e7\u00f5es dos \u00faltimos 90 dias.<\u002Fp>\n\n  <div class=\"ep-papel\" style=\"background:#fff;border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:20px 18px;box-shadow:var(--shadow-md);margin-bottom:20px\">\n    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--color-divider);padding-bottom:14px;margin-bottom:14px\">\n      <div>\n        <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1.1\">{{ petNome }}<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--color-neutral-700)\">{{ petSubtitulo }}<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--color-neutral-700)\">Tutor: {{ tutorNome }} \u00b7 {{ tutorUsuario }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right\">\n        <div style=\"font-family:var(--font-heading);font-size:13px\">EsserePet<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:var(--color-neutral-600)\">emitido em {{ hojeStr }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Vacinas registradas<\u002Fdiv>\n    <div style=\"margin-bottom:20px\">\n      <div style=\"display:flex;gap:8px;padding:0 0 6px;border-bottom:1px solid var(--color-divider);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-600)\">\n        <span style=\"flex:1.4;padding-left:10px\">Dose<\u002Fspan><span style=\"flex:1\">Aplicada<\u002Fspan><span style=\"flex:1\">Lote<\u002Fspan><span style=\"flex:1.6\">Respons\u00e1vel<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ vacinas }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <div style=\"border-bottom:1px solid var(--color-neutral-200);padding:9px 0\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n            <span style=\"font-size:13px;font-weight:600\">{{ v.nome }}<\u002Fspan>\n            <span style=\"font-size:10.5px;color:var(--color-neutral-600)\">{{ v.esquemaLabel }} \u00b7 {{ v.status }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:10.5px;color:var(--color-neutral-600);margin-bottom:5px\">{{ v.proximaLabel }}<\u002Fdiv>\n          <sc-for list=\"{{ v.doses }}\" as=\"d\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:8px;font-size:11.5px;padding:3px 0\">\n              <span style=\"flex:1.4;padding-left:10px\">{{ d.ordem }}<\u002Fspan>\n              <span style=\"flex:1\">{{ d.data }}<\u002Fspan>\n              <span style=\"flex:1;font-family:ui-monospace,Menlo,monospace\">{{ d.lote }}<\u002Fspan>\n              <span style=\"flex:1.6\">{{ d.vet }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Banho e cuidados<\u002Fdiv>\n    <div style=\"margin-bottom:20px\">\n      <sc-for list=\"{{ cuidados }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--color-neutral-200);font-size:12px\">\n          <span style=\"flex:2;font-weight:600\">{{ c.nome }}<\u002Fspan>\n          <span style=\"flex:1.4\">\u00faltimo {{ c.ultimo }}<\u002Fspan>\n          <span style=\"flex:1.2\">a cada {{ c.intervalo }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Tratamentos em curso<\u002Fdiv>\n    <div style=\"margin-bottom:20px\">\n      <sc-for list=\"{{ medsExport }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--color-neutral-200);font-size:12px\">\n          <span style=\"flex:2;font-weight:600\">{{ m.nome }}<\u002Fspan>\n          <span style=\"flex:1.6\">{{ m.dose }} \u00b7 {{ m.intervalo }}<\u002Fspan>\n          <span style=\"flex:1.6\">{{ m.periodo }}<\u002Fspan>\n          <span style=\"flex:1.8\">{{ m.horario }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ semMedsExport }}\">\n        <div style=\"font-size:12px;color:var(--color-neutral-600);padding:7px 0\">Nenhum tratamento em curso hoje.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">Peso<\u002Fdiv>\n    <div style=\"margin-bottom:20px\">\n      <sc-for list=\"{{ pesosExport }}\" as=\"w\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--color-neutral-200);font-size:12px\">\n          <span style=\"flex:1.2\">{{ w.data }}<\u002Fspan>\n          <span style=\"flex:1;font-weight:600\">{{ w.valor }} kg<\u002Fspan>\n          <span style=\"flex:2;color:var(--color-neutral-600)\">{{ w.faixa }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px\">\u00daltimas anota\u00e7\u00f5es<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\">\n      <sc-for list=\"{{ notasMes }}\" as=\"n\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;gap:10px;align-items:flex-start\">\n          <div style=\"width:66px;flex-shrink:0;font-size:11.5px;color:var(--color-neutral-700)\">{{ n.data }}<\u002Fdiv>\n          <div style=\"flex:1\">\n            <span style=\"font-size:12.5px\">{{ n.texto }}<\u002Fspan>\n            <sc-if value=\"{{ n.temFoto }}\">\n              <div style=\"margin-top:6px;display:flex;gap:8px;align-items:center\">\n                <div style=\"width:58px;height:44px;border-radius:6px;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-300));background-image:{{ n.fotoImg }};background-size:cover;background-position:center;flex-shrink:0\"><\u002Fdiv>\n                <span style=\"font-size:10.5px;color:var(--color-neutral-600)\">{{ n.legendaFoto }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ semNotasMes }}\">\n        <div style=\"font-size:12.5px;color:var(--color-neutral-600)\">Nenhuma anota\u00e7\u00e3o nos \u00faltimos 90 dias.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid var(--color-divider);padding-top:14px;font-size:11px;color:var(--color-neutral-700)\">Peso atual {{ pesoAtual }} kg \u00b7 {{ petTotalVacinas }} registros de vacina. Documento gerado pelo tutor no EsserePet em {{ hojeStr }}.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px;margin-top:0\" onClick=\"{{ baixarPdf }}\">Baixar PDF<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContatos }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 20px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irPerfil }}\">\u2190 Perfil<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 4px\">Contatos de urg\u00eancia<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 20px\">Quem chamar quando algo acontece fora do hor\u00e1rio da cl\u00ednica.<\u002Fp>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:18px\">\n    <sc-for list=\"{{ contatos }}\" as=\"c\" hint-placeholder-count=\"2\">\n      <div style=\"background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px\">\n          <div style=\"font-family:var(--font-heading);font-size:18px;flex:1;min-width:0\">{{ c.hospital }}<\u002Fdiv>\n          <span class=\"tag {{ c.tagClass }}\">{{ c.rotulo }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--color-neutral-700);margin-bottom:12px\">{{ c.vet }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-bottom:8px\">\n          <button class=\"btn btn-ghost\" style=\"font-size:13px;padding-left:0;gap:6px\" onClick=\"{{ c.editar }}\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>\n            Editar<\u002Fbutton>\n          <button class=\"btn btn-ghost\" style=\"font-size:13px;gap:6px;color:var(--color-accent-700)\" onClick=\"{{ c.excluir }}\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M8 6V4h8v2\"><\u002Fpath><path d=\"M19 6l-1 14H6L5 6\"><\u002Fpath><\u002Fsvg>\n            Excluir<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"btn btn-primary\" style=\"flex:1;height:42px;border-radius:999px;gap:8px;font-size:13px\" onClick=\"{{ nada }}\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2Z\"><\u002Fpath><\u002Fsvg>\n            {{ c.telefone }}<\u002Fbutton>\n          <button class=\"btn btn-secondary\" style=\"flex:1;height:42px;border-radius:999px;font-size:13px\" onClick=\"{{ nada }}\">WhatsApp<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <button class=\"btn btn-secondary btn-block\" style=\"height:50px;border-radius:999px;gap:8px\" onClick=\"{{ irNovoContato }}\">\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n    Cadastrar contato<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNovoContato }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 20px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irContatos }}\">\u2190 Cancelar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 20px\">{{ tituloContato }}<\u002Fh2>\n\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Hospital ou cl\u00ednica<\u002Flabel>\n    <input class=\"input\" value=\"{{ ctHospital }}\" onChange=\"{{ setCtHospital }}\" placeholder=\"Ex.: Hospital Vet 24h\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Veterin\u00e1rio respons\u00e1vel<\u002Flabel>\n    <input class=\"input\" value=\"{{ ctVet }}\" onChange=\"{{ setCtVet }}\" placeholder=\"Nome e CRMV\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Telefone<\u002Flabel>\n    <input class=\"input\" value=\"{{ ctTel }}\" onChange=\"{{ setCtTel }}\" placeholder=\"(11) 0000-0000\" inputmode=\"tel\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>WhatsApp<\u002Flabel>\n    <input class=\"input\" value=\"{{ ctZap }}\" onChange=\"{{ setCtZap }}\" placeholder=\"(11) 90000-0000\" inputmode=\"tel\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:22px\"><label>Tipo<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ clsUrgencia }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 14px\" onClick=\"{{ setUrgencia }}\">Urg\u00eancia 24h<\u002Fbutton>\n      <button class=\"tag {{ clsConfianca }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 14px\" onClick=\"{{ setConfianca }}\">Vet de confian\u00e7a<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarContato }}\">Salvar contato<\u002Fbutton>\n  <sc-if value=\"{{ editandoContato }}\">\n    <button class=\"btn btn-ghost btn-block\" style=\"height:46px;color:var(--color-accent-700)\" onClick=\"{{ excluirEsteContato }}\">Excluir contato<\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ confirmandoMed }}\">\n<div style=\"position:absolute;left:0;right:0;top:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:28px\">\n  <button style=\"position:absolute;inset:0;border:0;background:rgba(32,30,29,.45);cursor:pointer\" onClick=\"{{ fecharConfirmMed }}\"><\u002Fbutton>\n  <div style=\"position:relative;background:var(--color-bg);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-lg);max-width:300px;width:100%\">\n    <h4 style=\"font-family:var(--font-heading);font-size:19px;margin:0 0 8px\">{{ tituloConfirmMed }}<\u002Fh4>\n    <p style=\"font-size:13.5px;color:var(--color-neutral-700);margin:0 0 18px;text-wrap:pretty\">{{ textoConfirmMed }}<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <button class=\"btn btn-primary btn-block\" style=\"height:46px;border-radius:999px;margin-top:0\" onClick=\"{{ confirmarFimMed }}\">{{ okConfirmMed }}<\u002Fbutton>\n      <button class=\"btn btn-secondary btn-block\" style=\"height:46px;border-radius:999px;margin-top:0\" onClick=\"{{ fecharConfirmMed }}\">{{ cancelConfirmMed }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ fabAberto }}\">\n<div style=\"position:absolute;left:0;right:0;bottom:0;top:0;z-index:80;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;box-sizing:border-box\">\n  <button style=\"position:absolute;inset:0;border:0;background:rgba(32,30,29,.45);cursor:pointer\" onClick=\"{{ fecharFab }}\"><\u002Fbutton>\n  <div style=\"position:relative;background:var(--color-bg);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box\">\n    <h4 style=\"font-family:var(--font-heading);font-size:19px;margin:0 0 14px\">O que voc\u00ea quer registrar?<\u002Fh4>\n    <button class=\"btn btn-secondary btn-block\" style=\"height:52px;border-radius:999px;justify-content:flex-start;padding-left:18px;gap:12px;margin-top:0\" onClick=\"{{ fabNovoPet }}\">\n      <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"4\" r=\"2\"><\u002Fcircle><circle cx=\"18\" cy=\"8\" r=\"2\"><\u002Fcircle><circle cx=\"20\" cy=\"16\" r=\"2\"><\u002Fcircle><path d=\"M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z\"><\u002Fpath><\u002Fsvg>\n      Cadastrar novo pet<\u002Fbutton>\n    <div style=\"font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-neutral-600);margin:20px 0 10px\">Registrar vacina para<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ petsVivos }}\" as=\"pet\" hint-placeholder-count=\"3\">\n        <button style=\"display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:999px;padding:9px 14px 9px 9px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ pet.registrarVacina }}\">\n          <div style=\"background-image:{{ pet.fotoImg }};background-size:cover;background-position:center;width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:15px;flex-shrink:0;background:{{ pet.chipBg }};color:{{ pet.corTexto }}\"><span style=\"visibility:{{ pet.letraVis }}\">{{ pet.iniciais }}<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-width:0\"><div style=\"font-size:14.5px;font-weight:600\">{{ pet.nome }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--color-neutral-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ pet.subtitulo }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n\n<\u002Fdiv>\n\n  <sc-if value=\"{{ temToast }}\">\n    <div role=\"status\" style=\"position:fixed;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top));width:min(420px,calc(100% - 24px));z-index:90;display:flex;gap:12px;align-items:flex-start;background:var(--color-neutral-900);border-radius:var(--radius-lg);padding:13px 15px;box-shadow:var(--shadow-lg)\">\n      <button style=\"all:unset;flex:1;min-width:0;cursor:pointer;display:flex;gap:12px;align-items:flex-start\" onClick=\"{{ abrirToast }}\">\n        <span style=\"width:34px;height:34px;border-radius:9px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"><\u002Fpath><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"flex:1;min-width:0;display:block\">\n          <span style=\"display:block;font-size:13.5px;font-weight:600;color:var(--color-neutral-100)\">{{ toastTitulo }}<\u002Fspan>\n          <span style=\"display:block;font-size:12.5px;color:var(--color-neutral-400)\">{{ toastCorpo }}<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ toastTemDose }}\">\n        <button class=\"btn btn-primary\" style=\"border-radius:999px;height:34px;font-size:12.5px;padding:0 12px;flex-shrink:0;align-self:center\" onClick=\"{{ toastDarDose }}\">Dei a dose<\u002Fbutton>\n      <\u002Fsc-if>\n      <button aria-label=\"Fechar\" style=\"all:unset;cursor:pointer;color:var(--color-neutral-400);font-size:18px;line-height:1;padding:2px 4px\" onClick=\"{{ fecharToast }}\">\u00d7<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script>\n\n// Data/hora reais do aparelho (antes eram fixas no prot\u00f3tipo: 07/08/2026 14:20)\nconst pad2 = n => String(n).padStart(2, \"0\");\nconst hojeBr = () => { const d = new Date(); return pad2(d.getDate()) + \"/\" + pad2(d.getMonth() + 1) + \"/\" + d.getFullYear(); };\nlet HOJE = hojeBr();\nconst brParaIso = br => { const p = String(br || \"\").split(\"/\"); return p.length === 3 ? p[2] + \"-\" + p[1] + \"-\" + p[0] : \"\"; };\nconst isoParaBr = iso => { const p = String(iso || \"\").split(\"-\"); return p.length === 3 && p[0].length === 4 ? p[2] + \"/\" + p[1] + \"/\" + p[0] : \"\"; };\n\nconst OBS0 = \"Nenhuma rea\u00e7\u00e3o observada nas 48 horas seguintes.\";\n\nfunction somaDias(br, n) {\n  const p = String(br).split(\"/\");\n  const d = new Date(+p[2], +p[1] - 1, +p[0]);\n  d.setDate(d.getDate() + n);\n  const dd = String(d.getDate()).padStart(2, \"0\"), mm = String(d.getMonth() + 1).padStart(2, \"0\");\n  return dd + \"/\" + mm + \"/\" + d.getFullYear();\n}\nfunction somaAnos(br, n) {\n  const p = String(br).split(\"/\");\n  return p[0] + \"/\" + p[1] + \"/\" + (+p[2] + n);\n}\n\n// papel de cada dose no bloco: gravado no registro; nos dados antigos, emparelhado por ciclo\nfunction papelDose(v, d, i, total) {\n  if (d.papel) return d.papel;\n  if (v.esquema !== \"reforco\") return \"Dose \u00fanica\";\n  return (total - 1 - i) % 2 === 0 ? \"1\u00aa dose\" : \"Refor\u00e7o\";\n}\n\n// cada vacina \u00e9 um bloco: um esquema com o hist\u00f3rico de doses (mais recente primeiro)\nfunction vac(o) {\n  const doses = o.doses ? o.doses.slice() : [{ data: o.data, lote: o.lote, vet: o.vet, clinica: o.clinica, obs: o.obs || OBS0 }];\n  const ult = doses[0];\n  return {\n    id: o.id, nome: o.nome, esquema: o.esquema || \"unica\", doses: doses,\n    proxima: o.proxima, status: o.status,\n    data: ult.data, lote: ult.lote, vet: ult.vet, clinica: ult.clinica, obs: ult.obs || OBS0\n  };\n}\n\nconst PETS0 = [\n  { id: \"mel\", nome: \"Mel\", raca: \"Golden Retriever\", sexo: \"F\u00eamea\", nasc: \"2023-03-12\", tipo: \"Nascimento\", chip: \"900 118 000 452 771\",\n    cuidados: [\n      { id: \"cu1\", nome: \"Banho\", dias: 21, ultimo: \"22/07/2026\" },\n      { id: \"cu2\", nome: \"Antipulgas\", dias: 30, ultimo: \"12/07/2026\" },\n      { id: \"cu3\", nome: \"Verm\u00edfugo\", dias: 90, ultimo: \"20/06/2026\" },\n      { id: \"cu4\", nome: \"Corte de unhas\", dias: 45, ultimo: \"01/08/2026\" }\n    ],\n    medicacoes: [\n      { id: \"me1\", nome: \"Amoxicilina 250mg\", dose: \"1 comprimido\", horas: 12, dias: 7, inicio: \"05/08/2026\", proximaHora: \"20:00\", ativa: true, dadas: 4 },\n      { id: \"me2\", nome: \"Anti-inflamat\u00f3 0eamea\", nasc: \"2024-11-09\", tipo: \"Nascimento\", chip: \"\",\n  pesoMin: \"5,0\", pesoMax: \"7,0\",\n  pesos: [{ data: \"26/07/2026\", valor: \"6,1\" }],\n  notas: [{ data: \"26/07/2026\", texto: \"Primeira consulta na cl\u00ednica do bairro. Tudo certo.\" }],\n  vacinas: [\n    vac({ id: \"n1\", nome: \"V10\", data: \"18/01/2026\", proxima: \"18/01/2027\", lote: \"V10-8821\", vet: \"Dra. Renata Fonseca\", clinica: \"Vet Popular Tatuap\u00e9\", status: \"Em dia\" }),\n    vac({ id: \"n2\", nome: \"Raiva\", data: \"18/01/2026\", proxima: \"18/01/2027\", lote: \"RB-8822\", vet: \"Dra. Renata Fonseca\", clinica: \"Vet Popular Tatuap\u00e9\", status: \"Em dia\" })\n  ]\n};\n\n// Cada conta \u00e9 um espa\u00e7o isolado: o app s\u00f3 carrega os dados da conta autenticada.\nconst CONTAS0 = [\n  { id: \"u1\", usuario: \"@jonatas.silva\", nome: \"Jonatas Silva\", email: \"jonatas@email.com\", telefone: \"(11) 98\u2022\u2022\u2022\u2022-4412\", plano: \"premium\", pets: PETS0, contatos: CONTATOS0 },\n  { id: \"u2\", usuario: \"@marina.costa\", nome: \"Marina Costa\", email: \"marina@email.com\", telefone: \"(11) 97\u2022\u2022\u2022\u2022-2093\", plano: \"free\", pets: [NINA], contatos: [] }\n];\n\nconst CONSENTIMENTOS0 = [\n  { id: \"lembretes\", titulo: \"Lembretes de vacina\", detalhe: \"Notifica\u00e7\u00f5es sobre doses pr\u00f3ximas e atrasadas\", on: true },\n  { id: \"dicas\", titulo: \"Dicas por e-mail\", detalhe: \"Conte\u00fado dos veterin\u00e1rios parceiros, uma vez por semana\", on: false },\n  { id: \"pesquisa\", titulo: \"Estat\u00edsticas an\u00f4nimas\", detalhe: \"Uso de dados sem identifica\u00e7\u00e3o para melhorar o app\", on: false }\n];\n\n// prefer\u00eancias de f\u00e1brica (usadas ao sair de uma conta de demonstra\u00e7\u00e3o)\nfunction padraoDemo() {\n  return { consentimentos: JSON.parse(JSON.stringify(CONSENTIMENTOS0)), push: true, pushCuidados: true, bio: true,\n    extrasCaninas: [], extrasFelinas: [], listaVacinas: OPCOES.slice(), pets: [], contatos: [] };\n}\nconst num = v => parseFloat(String(v || \"\").replace(\",\", \".\")) || 0;\n\nlet HOJE_D = new Date(); HOJE_D.setHours(0, 0, 0, 0);\nfunction idadeDe(iso) {\n  if (!iso) return \"idade n\u00e3o informada\";\n  const p = String(iso).split(\"-\");\n  const d = new Date(+p[0], +p[1] - 1, +p[2]);\n  if (isNaN(d)) return \"idade n\u00e3o informada\";\n  let meses = (HOJE_D.getFullYear() - d.getFullYear()) * 12 + (HOJE_D.getMonth() - d.getMonth());\n  if (HOJE_D.getDate() < d.getDate()) meses -= 1;\n  if (meses < 1) return \"rec\u00e9m-nascido\";\n  if (meses < 24) return meses + (meses === 1 ? \" m\u00eas\" : \" meses\");\n  const anos = Math.floor(meses / 12), resto = meses % 12;\n  return anos + \" anos\" + (resto ? \" e \" + resto + (resto === 1 ? \" m\u00eas\" : \" meses\") : \"\");\n}\nfunction dataBr(iso) { if (!iso) return \"\u2014\"; const p = String(iso).split(\"-\"); return p[2] + \"/\" + p[1] + \"/\" + p[0]; }\nfunction subt(p) { return [p.raca || \"SRD\", p.sexo || \"\u2014\", idadeDe(p.nasc)].join(\" \u00b7 \"); }\nlet AGORA = \"\", AGORA_MIN = 0;\nconst dtBr = d => pad2(d.getDate()) + \"/\" + pad2(d.getMonth() + 1) + \"/\" + d.getFullYear();\nconst hrBr = d => pad2(d.getHours()) + \":\" + pad2(d.getMinutes());\nconst dtCurto = d => pad2(d.getDate()) + \"/\" + pad2(d.getMonth() + 1);\nfunction brHora(br, h) { const p = String(br || \"\").split(\"/\"), q = String(h || \"00:00\").split(\":\"); return new Date(+p[2], +p[1] - 1, +p[0], +q[0] || 0, +q[1] || 0); }\n// data/hora da pr\u00f3xima dose de um rem\u00e9dio (registros antigos s\u00f3 tinham a hora)\nfunction proximaDoseDe(m) {\n  if (m.proximaData) return brHora(m.proximaData, m.proximaHora);\n  const hoje = brHora(HOJE, m.proximaHora);\n  return hoje.getTime() < Date.now() - 36e5 ? new Date(hoje.getTime() + 864e5) : hoje;\n}\nfunction ultimaDoseDe(m) { return m.ultimaData ? brHora(m.ultimaData, m.ultimaHora) : null; }\nfunction quandoDose(d, semData) {\n  const min = Math.roun
