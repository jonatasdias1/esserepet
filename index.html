document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

A, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* \u2014 dialog \u2014 */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* \u2014 rounded frame: everything softens, small controls go pill \u2014 */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"b3608e0d-c0bb-434e-8937-5cf276bb1c10\"><\u002Fscript>\n<style>\nhtml,body{margin:0;min-height:100%;background:var(--color-neutral-200)}\n*{scrollbar-width:thin;scrollbar-color:transparent transparent}\nbody.rolando *{scrollbar-color:rgba(32,30,29,.3) transparent}\n::-webkit-scrollbar{width:6px;height:6px;background:transparent}\n::-webkit-scrollbar-track{background:transparent;border:0}\n::-webkit-scrollbar-thumb{background:transparent;border-radius:999px;transition:background .35s ease}\nbody.rolando ::-webkit-scrollbar-thumb{background:rgba(32,30,29,.3)}\na{color:var(--color-accent-700)}\na:hover{color:var(--color-accent-900)}\n.ep-page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 28px 32px;box-sizing:border-box;\n  background:radial-gradient(120% 80% at 50% 0%, var(--color-accent-2-200) 0%, var(--color-neutral-200) 60%)}\n.ep-shell{position:relative;width:100%;max-width:1120px;height:min(900px,calc(100dvh - 60px));display:flex;flex-direction:column;overflow:hidden;\n  background:var(--color-bg);border-radius:32px;box-shadow:var(--shadow-lg)}\n.ep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}\n.ep-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:70px;width:100%;max-width:1040px;margin:0 auto;padding:0 24px;box-sizing:border-box}\n.ep-menu{position:absolute;right:24px;top:64px;width:262px;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:10px;z-index:60}\n@media (max-width:640px){.ep-menu{right:12px;left:12px;width:auto}}\n/* \u2500\u2500 tema \u2500\u2500 */\n:root{color-scheme:light}\n/* controles herdam a cor do texto (sem isso, com o sistema em modo escuro, bot\u00f5es ficavam com texto branco) */\n:where(button,input,textarea,select){color:inherit}\nhtml[data-theme=\"dark\"]{color-scheme:dark;\n  --color-bg:#1c1a18;--color-surface:#2b2723;--color-text:#f1e8da;--color-divider:color-mix(in srgb,#f1e8da 14%,transparent);\n  --color-neutral-100:#25221f;--color-neutral-200:#2d2925;--color-neutral-300:#3a352f;--color-neutral-400:#555047;--color-neutral-500:#716a5f;\n  --color-neutral-600:#9b9283;--color-neutral-700:#bbb1a2;--color-neutral-800:#d8cfc1;--color-neutral-900:#f0e8dd;\n  --color-accent:#d27b43;\n  --color-accent-100:#2c1c13;--color-accent-200:#3c2517;--color-accent-300:#56331c;--color-accent-400:#7c4826;--color-accent-500:#b2622d;\n  --color-accent-600:#d67f48;--color-accent-700:#f2a06d;--color-accent-800:#ffc6a5;--color-accent-900:#ffe1 e-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}\n  .ep-grid{grid-template-columns:minmax(0,1fr)}\n  .ep-bar{height:62px;padding:0 16px;gap:10px}\n  /* iOS d\u00e1 zoom em campos com fonte < 16px */\n  .ep-shell .input,.ep-shell select,.ep-shell textarea{font-size:16px}\n  .ep-shell [style*=\"white-space: nowrap\"][style*=\"text-overflow: ellipsis\"]{white-space:normal !important}\n}\n@media (max-width:520px){\n  .ep-quem{display:none !important}\n  .ep-reg{width:42px;padding:0 !important}\n  .ep-reg-txt{display:none}\n}\n@media (max-width:380px){\n  .ep-shell [style*=\"padding: 30px 24px\"],.ep-shell [style*=\"padding: 30px 20px\"],.ep-shell [style*=\"padding: 28px 20px\"]{padding-left:16px !important;padding-right:16px !important}\n}\n<\u002Fstyle><\u002Fhelmet>\n\n<div class=\"ep-page\">\n  <div class=\"ep-shell\">\n\n<div style=\"flex:1;min-height:0;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)\">\n\n<sc-if value=\"{{ mostrarTabs }}\">\n<div style=\"position:relative;flex-shrink:0;background:var(--color-bg);border-bottom:1px solid var(--color-divider);z-index:30\">\n  <div class=\"ep-bar\">\n    <button style=\"display:flex;align-items:center;gap:10px;background:transparent;border:0;cursor:pointer;font-family:var(--font-heading);font-size:17px;color:var(--color-neutral-800);padding:0\" onClick=\"{{ irHome }}\">\n      <span style=\"width:28px;height:28px;border-radius:999px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"4\" r=\"2\"><\u002Fcircle><circle cx=\"18\" cy=\"8\" r=\"2\"><\u002Fcircle><circle cx=\"20\" cy=\"16\" r=\"2\"><\u002Fcircle><path d=\"M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 round:var(--color-neutral-200);border-radius:var(--radius-md);padding:11px 14px;margin-top:26px;font-size:11.5px;color:var(--color-neutral-700);line-height:1.5\">Quer s\u00f3 conhecer o app? Digite <strong>@jonatas.silva<\u002Fstrong> (Premium) ou <strong>@marina.costa<\u002Fstrong> (gratuito) no campo de e-mail, com qualquer senha. Nas contas de demonstra\u00e7\u00e3o nada fica salvo.<\u002Fdiv>\n  <div style=\"text-align:center;font-size:14px;color:var(--color-neutral-700);padding-top:20px\">Ainda n\u00e3o tem conta?\n    <button class=\"btn btn-ghost\" style=\"font-size:14px\" onClick=\"{{ irCadastro }}\">Criar conta<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNovaSenha }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:460px;margin:0 auto;box-sizing:border-box;padding:52px 26px 36px\">\n  <h2 style=\"font-family:var(--font-heading);font-size:29px;margin:0 0 6px\">Nova senha<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 26px\">Escolha a nova senha da sua conta.<\u002Fp>\n  <div class=\"field\" style=\"margin-bottom:14px\"><label>Nova senha<\u002Flabel><input class=\"input\" type=\"password\" value=\"{{ novaSenha1 }}\" onChange=\"{{ setNovaSenha1 }}\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\" autocomplete=\"new-password\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:8px\"><label>Confirmar<\u002Flabel><input class=\"input\" type=\"password\" value=\"{{ novaSenha2 }}\" onChange=\"{{ setNovaSenha2 }}\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\" autocomplete=\"new-password\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 20px\">M\u00ednimo de 8 caracteres, com uma letra e um n\u00famero.<\u002Fp>\n  <sc-if value=\"{{ temErroNovaSenha }}\">\n    <div style=\"background:var(--color-accent-200);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:14px rgin-bottom:12px\">\n          <div style=\"background-image:{{ pet.fotoImg }};background-size:cover;background-position:center;width:56px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:21px;flex-shrink:0;background:{{ pet.chipBg }};color:{{ pet.corTexto }}\"><span style=\"visibility:{{ pet.letraVis }}\">{{ pet.iniciais }}<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-family:var(--font-heading);font-size:21px;line-height:1.15\">{{ pet.nome }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:{{ pet.corTexto }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ pet.subtitulo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"tag\" style=\"flex-shrink:0;font-weight:600;background:{{ pet.tagBg }};color:{{ pet.tagCor }};border:1px solid {{ pet.tagBorda }}\">{{ pet.statusLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;margin-bottom:12px;color:{{ pet.corTexto }}\">{{ pet.legenda }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <div style=\"flex:1;border-radius:var(--radius-md);padding:10px;background:{{ pet.chipBg }}\">\n            <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1\">{{ pet.totalVacinas }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:{{ pet.corTexto }}\">registros<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:2;border-radius:var(--radius-md);padding:10px;background:{{ pet.chipBg }}\">\n            <div style=\"font-family:var(--font-heading);font-size:19px;line-height:1\">{{ pet.proximaNome }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:{{ pet.corTexto }}\">{{ pet.proximaQuando }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n    <button class=\"btn btn-secondary btn-block\" style=\"height:52px;border-radius:999px;gap:8px;grid-column:1/-1\" onClick=\"{{ irNovoPet }}\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>\n      Novo pet<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 12px\">\n    <h4 style=\"font-family:var(--font-heading);font-size:19px;margin:0\">Dicas de quem cuida<\u002Fh4>\n    <button class=\"btn btn-ghost\" style=\"font-size:13px\" onClick=\"{{ irDicas }}\">Ver todas<\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"font-size:12.5px;color:var(--color-neutral-700);margin:0 0 14px\">Publicadas por veterin\u00e1rios parceiros, atualizadas toda semana.<\u002Fp>\n  <div class=\"ep-grid\">\n    <sc-for list=\"{{ dicasHome }}\" as=\"d\" hint-placeholder-count=\"3\">\n      <button style=\"display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:13px 14px;cursor:pointer;font-family:var(--font-body)\" onClick=\"{{ d.abrir }}\">\n        <div style=\"width:44px;height:44px;border-radius:999px;background:var(--color-accent-2-200);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-800)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21c-4-2.5-7-5.6-7-9.5A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7 3.5c0 3.9-3 7-7 9.5Z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:14.5px;font-weight:600;margin-bottom:2px\">{{ d.titulo }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ d.autor }} \u00b7 {{ d.tempo }}<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"tag tag-neutral\">{{ d.categoria }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEditarPerfil }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irPerfil }}\">\u2190 Cancelar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 20px\">Editar perfil<\u002Fh2>\n\n  <div style=\"display:flex;justify-content:center;margin-bottom:24px\">\n    <button style=\"background-image:{{ tutorFotoImg }};background-size:cover;background-position:center;position:relative;width:104px;height:104px;border-radius:999px;background:var(--color-accent-2-300);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:34px;color:var(--color-accent-2-800);border:0;cursor:pointer\" onClick=\"{{ trocarFotoTutor }}\"><span style=\"visibility:{{ tutorLetraVis }}\">{{ tutorIniciais }}<\u002Fspan>\n      <span style=\"position:absolute;bottom:0;right:0;width:34px;height:34px;border-radius:999px;background:var(--color-accent);border:3px solid var(--color-bg);display:flex;align-items:center;justify-content:center\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n      <\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Nome completo<\u002Flabel>\n    <input class=\"input\" value=\"{{ epNome }}\" onChange=\"{{ setEpNome }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>E-mail<\u002Flabel>\n    <input class=\"input\" value=\"{{ epEmail }}\" onChange=\"{{ setEpEmail }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Telefone<\u002Flabel>\n    <input class=\"input\" value=\"{{ epTelefone }}\" onChange=\"{{ setEpTelefone }}\" inputmode=\"tel\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:8px\"><label>Nome de usu\u00e1rio<\u002Flabel>\n    <input class=\"input\" value=\"{{ epUsuario }}\" onChange=\"{{ setEpUsuario }}\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 22px\">\u00c9 o que aparece nas telas e nos documentos compartilhados. Seu CPF fica guardado apenas no login.<\u002Fp>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarPerfil }}\">Salvar altera\u00e7\u00f5es<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEditarPet }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCaderneta }}\">\u2190 Cancelar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 4px\">Editar {{ petNome }}<\u002Fh2>\n  <p style=\"font-size:13px;color:var(--color-neutral-700);margin:0 0 22px\">Dados do pet. As vacinas s\u00f3 mudam pela caderneta.<\u002Fp>\n\n  <div style=\"display:flex;justify-content:center;margin-bottom:24px\">\n    <button style=\"background-image:{{ petFotoImg }};background-size:cover;background-position:center;position:relative;width:110px;height:110px;border-radius:999px;background:var(--color-accent-200);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:36px;color:var(--color-accent-800);border:0;cursor:pointer\" onClick=\"{{ trocarFotoPet }}\"><span style=\"visibility:{{ petLetraVis }}\">{{ petIniciais }}<\u002Fspan>\n      <span style=\"position:absolute;bottom:0;right:0;width:36px;height:36px;border-radius:999px;background:var(--color-accent);border:3px solid var(--color-bg);display:flex;align-items:center;justify-content:center\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n      <\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);text-align:center;margin:-14px 0 20px\">{{ avisoFotoPet }}<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Nome<\u002Flabel>\n    <input class=\"input\" value=\"{{ edNome }}\" onChange=\"{{ setEdNome }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Esp\u00e9cie<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ edSegCanino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetCanino }}\">Canino<\u002Fbutton>\n      <button class=\"tag {{ edSegFelino }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetFelino }}\">Felino<\u002Fbutton>\n      <button class=\"tag {{ edSegOutros }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetOutros }}\">Outros<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Sexo<\u002Flabel>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"tag {{ edClsMacho }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetMacho }}\">Macho<\u002Fbutton>\n      <button class=\"tag {{ edClsFemea }}\" style=\"border:0;cursor:pointer;font-family:var(--font-body);font-size:13px;padding:8px 16px\" onClick=\"{{ edSetFemea }}\">F\u00eamea<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Ra\u00e7a<\u002Flabel>\n    <input class=\"input\" value=\"{{ edRaca }}\" onChange=\"{{ setEdRaca }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:6px\"><label>Nascimento ou resgate<\u002Flabel>\n    <input class=\"input\" type=\"date\" max=\"{{ hojeIso }}\" value=\"{{ edData }}\" onChange=\"{{ setEdData }}\" style=\"width:100%\"><\u002Fdiv>\n  <p style=\"font-size:12px;color:var(--color-neutral-600);margin:0 0 16px\">Idade calculada: {{ edIdade }}<\u002Fp>\n  <div style=\"display:flex;gap:12px;margin-bottom:16px\">\n    <div class=\"field\" style=\"flex:1\"><label>Peso m\u00ednimo ideal<\u002Flabel>\n      <input class=\"input\" value=\"{{ minInput }}\" onChange=\"{{ setMinInput }}\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n    <div class=\"field\" style=\"flex:1\"><label>Peso m\u00e1ximo ideal<\u002Flabel>\n      <input class=\"input\" value=\"{{ maxInput }}\" onChange=\"{{ setMaxInput }}\" inputmode=\"decimal\" style=\"width:100%\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:26px\"><label>Microchip<\u002Flabel>\n    <input class=\"input\" value=\"{{ edChip }}\" onChange=\"{{ setEdChip }}\" placeholder=\"000 000 000 000 000\" style=\"width:100%\"><\u002Fdiv>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarEdicaoPet }}\">Salvar altera\u00e7\u00f5es<\u002Fbutton>\n  <button class=\"btn btn-ghost btn-block\" style=\"height:46px\" onClick=\"{{ irObito }}\">Registrar falecimento<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isObito }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;box-sizing:border-box;padding:30px 24px 36px\">\n  <button class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:12px\" onClick=\"{{ irCaderneta }}\">\u2190 Voltar<\u002Fbutton>\n  <h2 style=\"font-family:var(--font-heading);font-size:27px;margin:0 0 6px\">Despedida de {{ petNome }}<\u002Fh2>\n  <p style=\"font-size:14px;color:var(--color-neutral-700);margin:0 0 22px;text-wrap:pretty\">Sentimos muito. Ao confirmar, a caderneta de {{ petNome }} vira um memorial: o hist\u00f3rico fica guardado, os lembretes param de chegar e voc\u00ea pode acrescentar lembran\u00e7as quando quiser.<\u002Fp>\n\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Data<\u002Flabel>\n    <input class=\"input\" type=\"date\" max=\"{{ hojeIso }}\" value=\"{{ obitoData }}\" onChange=\"{{ setObitoData }}\" style=\"width:100%\"><\u002Fdiv>\n  <div class=\"field\" style=\"margin-bottom:16px\"><label>Uma frase para lembrar (opcional)<\u002Flabel>\n    <textarea class=\"input\" style=\"width:100%;border-radius:var(--radius-lg);min-height:84px\" value=\"{{ obitoFrase }}\" onChange=\"{{ setObitoFrase }}\" placeholder=\"O que voc\u00ea n\u00e3o quer esquecer dele\"><\u002Ftextarea><\u002Fdiv>\n\n  <button class=\"btn btn-primary btn-block\" style=\"height:52px;border-radius:999px;font-size:16px\" onClick=\"{{ salvarObito }}\">Criar memorial<\u002Fbutton>\n  <button class=\"btn btn-ghost btn-block\" style=\"height:46px\" onClick=\"{{ irCaderneta }}\">Voltar<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMemorial }}\">\n<div style=\"flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto\">\n  <div style=\"background:var(--color-accent-2-200);padding:28px 24px 30px;text-align:center\">\n    <button class=\"btn btn-ghost\" style=\"padding-left:0;float:left;color:var(--color-accent-2-900)\" onClick=\"{{ irHome }}\">\u2190 Meus pets<\u002Fbutton>\n    <div style=\"clear:both;height:6px\"><\u002Fdiv>\n    <div style=\"position:relative;width:190px;height:184px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center\">\n      <div style=\"background-image:{{ petFotoImg }};background-size:cover;background-position:center;position:relative;z-index:1;width:118px;height:118px;border-radius:999px;background:var(--color-accent-100);box-shadow:0 0 0 3px var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:42px;color:var(--color-accent-800)\"><span style=\"visibility:{{ petLetraVis }}\">{{ petIniciais }}<\u002Fspan><\u002Fdiv>\n      <svg class=\"ep-coroa\" width=\"190\" height=\"190\" viewBox=\"0 0 190 190\" aria-hidden=\"true\" style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;overflow:visible\"><path d=\"M78.4 173.3 L73.4 172.0 L68.4 170.5 L63.6 168.6 L58.9 166.4 L54.4 163.9 L50.0 161.2 L45.9 158.1 L41.9 154.8 L38.1 151.3 L34.6 147.5 L31.4 143.5 L28.4 139.3 L25.6 134.9 L23.2 130.3 L21.1 125.6 L19.3 120.8 L17.8 115.8 L16.6 110.8 L15.7 105.7 L15.2 100.6 L15.0 95.4 L15.1 90.3 L15.6 85.1 L16.4 80.0 L17.5 75.0 L19.0 70.0 L20.8 65.2 L22.9 60.4 L25.2 55.8 L27.9 51.4 L30.9 47.2 L34.1 43.2 L37.5 39.3 L41.3 35.7 L45.2 32.4 L49.3 29.3 L53.7 26.5 L58.2 24.0 L62.8 21.7 L67.6 19.8\" fill=\"none\" stroke=\"#5d7a40\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><ellipse cx=\"79.8\" cy=\"166.4\" rx=\"7.5\" ry=\"3.4\" fill=\"#6f8f4e\" transform=\"rotate(227.0 79.8 166.4)\"/><ellipse cx=\"76.9\" cy=\"180.1\" rx=\"7.5\" ry=\"3.4\" fill=\"#87a862\" transform=\"rotate(157.0 76.9 180.1)\"/><ellipse cx=\"64.1\" cy=\"161.2\" rx=\"7.5\" ry=\"3.4\" fill=\"#5d7a40\" transform=\"rotate(240.0 64.1 161.2)\"/><ellipse cx=\"58.2\" cy=\"173.8\" rx=\"7.5\" ry=\"3.4\" fill=\"#6f8f4e\" transform=\"rotate(170.0 58.2 173.8)\"/><ellipse cx=\"50.1\" cy=\"152.5\" rx=\"7.5\" ry=\"3.4\" fill=\"#87a862\" transform=\"rotate(253.0 50.1 152.5)\"/><ellipse cx=\"41.4\" cy=\"163.6\" rx=\"7.5\" ry=\"3.4\" fill=\"#5d7a40\" transform=\"rotat
